[workspace]
resolver = "2"
members = [
    "crates/core",
    "crates/bundler",
    "crates/cli",
    "crates/runtime",
    "crates/runtime_core",
    "crates/compile",
    "crates/http",
    "crates/introspect",
    "crates/platform",
    "crates/platform_server",
    "crates/platform_browser",
    "crates/transport",
    "crates/pool",
    "crates/engine",
    "crates/modules_common",
    "crates/deka_host",
    "crates/stdio",
    "crates/wasm_guest",
    "crates/wasm_guest_macros",
    "crates/wit_deka",
    "crates/wasm_cli",
    "crates/pm",
    "crates/deka_lsp",
    "crates/deka-router",
    "crates/deka-validation",
    "crates/deka_ui",
]

[workspace.package]
version = "0.45.0"

[workspace.dependencies]
# V8 Runtime (Deno Core)
deno_core = "0.410.0"
deno_napi = "0.188.0"
deno_permissions = "0.116.0"
deno_error = "0.7.1"

# Async Runtime
tokio = { version = "1.41", features = ["full"] }

# HTTP Server
axum = { version = "0.7", features = ["ws"] }
tower-http = { version = "0.6", features = ["cors"] }
hyper = "1"
hyper-util = { version = "0.1", features = ["tokio"] }
http-body-util = "0.1"
bytes = "1"
futures-util = "0.3"
notify = "6"
socket2 = { version = "0.6", features = ["all"] }
core_affinity = "0.8"
nanoid = "0.4"
num_cpus = "1.16"

# TypeScript/JavaScript parsing (handler validation)
swc_ecma_parser = { version = "31.0.0", features = ["typescript"] }
swc_ecma_ast = "19.0.0"
swc_common = "18.0.1"
swc_ecma_visit = "19.0.0"

# Parser combinators
nom = "7.1"

# Neo4j driver
neo4rs = "0.8"

# Redis driver
redis = "1.2"

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
chrono = "0.4"
toml = "0.8"
pm = { path = "crates/pm" }
