[package]
name = "tree-sitter-phpx"
description = "PHPX grammar for tree-sitter"
version = "0.24.3"
authors = [
  "Max Brunsfeld <maxbrunsfeld@gmail.com>",
  "Amaan Qureshi <amaanq12@gmail.com>",
]
license = "MIT"
readme = "README.md"
keywords = ["incremental", "parsing", "tree-sitter", "php"]
categories = ["parsing", "text-editors"]
repository = "https://github.com/samifouad/deka"
edition = "2021"
autoexamples = false

build = "bindings/rust/build.rs"
include = [
  "LICENSE",
  "common",
  "bindings/rust",
  "php/grammar.js",
  "php/src",
  "php_only/grammar.js",
  "php_only/src",
  "queries",
  "tree-sitter.json"
]

[lib]
path = "bindings/rust/lib.rs"

[dependencies]
tree-sitter-language = "0.1"

[build-dependencies]
cc = "1.1"

[dev-dependencies]
tree-sitter = "0.25"
