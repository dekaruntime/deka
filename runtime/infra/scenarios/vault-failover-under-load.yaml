name: vault-failover-under-load
duration: 60s
faults:
  - at: 10s
    host: demon
    cmd: process kill --service gg.tana.gild-vault --signal SIGKILL --undo-by 120s
  - at: 45s
    host: demon
    cmd: process start --service gg.tana.gild-vault
assertions:
  - at: 5s
    kind: http
    check: https://shop-beta.tana.gg
    status: 200
  - at: 30s
    kind: http
    check: https://shop-beta.tana.gg
    status: 200
  - at: 59s
    kind: systemd
    host: demon
    check: gg.tana.gild-vault is-active
  - at: 59s
    kind: http
    check: https://shop-beta.tana.gg
    status: 200
