[package]
name = "gild-storm-agent"
version = "0.1.0"
edition = "2024"

[[bin]]
name = "gild-storm-agent"
path = "src/main.rs"

[dependencies]
anyhow = "1"
clap = { version = "4.5", features = ["derive"] }
humantime = "2"
libc = "0.2"
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }

[dev-dependencies]
tempfile = "3"
