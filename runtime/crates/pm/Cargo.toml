[package]
name = "pm"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0"
base64 = "0.21"
dirs = "5"
reqwest = { version = "0.11", features = ["blocking", "json"] }
sha2 = "0.10"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tempfile = "3.6"
json5 = "1.3"
semver = "1.0"
tokio = { version = "1.35", features = ["rt-multi-thread", "macros", "sync", "net"] }
runtime_core = { path = "../runtime_core" }
modules_php = { path = "../modules_php" }
linkhash-client = { version = "=0.2.1", registry-index = "sparse+https://git.tana.gg/index/" }

[target.'cfg(target_os = "macos")'.dependencies]
libc = "0.2"

[dev-dependencies]
axum = "0.7"
