[package]
name = "modules_php"
version = "0.1.0"
edition = "2024"
build = "build.rs"

[dependencies]
deno_core = { workspace = true }
bumpalo = "3"
bytes = "1"
chrono = { version = "0.4", features = ["clock"] }
php-rs = { path = "../php-rs" }
cypher = { path = "../cypher" }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
prost = "0.13"
sha2 = "0.10"
postgres = { version = "0.19", features = ["with-chrono-0_4"] }
mysql = "26"
rusqlite = { version = "0.32", features = ["bundled"] }
wit-parser = "0.219.2"
deka-validation = { path = "../../../deka-validation" }
runtime_core = { path = "../runtime_core" }
stdio = { path = "../stdio" }
native-tls = "0.2"
getrandom = "0.2"
neo4rs = { workspace = true }
redis = { workspace = true }
tokio = { workspace = true }
deka-shard = { path = "../shard" }

# @deka/http — outbound HTTP/1.1, HTTP/2 (ALPN h2), streaming bodies,
# opt-in cookie jars. rustls keeps the TLS stack pure-Rust (no OpenSSL
# system dep surprise) and matches what `crates/runtime` already uses.
reqwest = { version = "0.11", default-features = false, features = ["rustls-tls", "stream", "cookies", "gzip", "json"] }
# @deka/http WebSocket client. tokio-tungstenite gives us the RFC 6455
# implementation with TLS via rustls, fragmentation reassembly, and
# ping/pong keepalive. Chosen over reqwest-websocket because it exposes
# full frame control (text/binary, close codes, ping payloads) which
# Stripe-style streaming APIs need.
tokio-tungstenite = { version = "0.21", default-features = false, features = ["connect", "rustls-tls-webpki-roots"] }
tokio-stream = "0.1"
futures-util = "0.3"
url = "2"

[build-dependencies]
prost-build = "0.13"
protoc-bin-vendored = "3"

[dev-dependencies]
tempfile = "3.23.0"
hmac = "0.12"
hex = "0.4"
