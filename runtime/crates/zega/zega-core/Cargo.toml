[package]
name = "zega-core"
version = "0.19.1"
edition = "2021"

[dependencies]
thiserror = "1.0"
bincode = "1.3"
serde = { version = "1.0", features = ["derive"] }
base64 = "0.22"
getrandom = { version = "0.2", features = ["js"] }
hmac = "0.12"
rsa = { version = "0.9", features = ["pem"] }
serde_json = "1.0"
sha2 = { version = "0.10", features = ["oid"] }
smallvec = "1.15"

zega-graph = { path = "../zega-graph" }
zega-kv = { path = "../zega-kv" }
zega-parser = { path = "../zega-parser" }
zega-wal = { path = "../zega-wal" }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
tokio = { version = "1", features = ["rt-multi-thread", "time"] }

[dev-dependencies]
tempfile = "3"
tokio = { version = "1", features = ["rt-multi-thread", "time"] }
