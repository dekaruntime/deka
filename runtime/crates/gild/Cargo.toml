[package]
name = "gild"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "gild"
path = "src/main.rs"

[dependencies]
age = "0.11.3"
clap = { version = "4.5", features = ["derive"] }
gild-chain = { path = "../gild-chain" }
gild-vault-client = { path = "../gild-vault-client" }
libc = "0.2"
reqwest = { version = "0.11", default-features = false, features = ["json", "rustls-tls"] }
regex = "1"
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
sha2 = "0.10"
tokio = { workspace = true, features = ["full"] }
toml = { workspace = true }

[dev-dependencies]
hmac = "0.12"
tempfile = "3"
