[package]
name = "tana-vault-agent"
version = "0.1.0"
edition = "2024"

[[bin]]
name = "tana-vault-agent"
path = "src/main.rs"

[dependencies]
anyhow = "1"
jsonwebtoken = "9"
libc = "0.2"
reqwest = { version = "0.11", default-features = false, features = ["json", "rustls-tls"] }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
tokio = { workspace = true, features = ["full"] }
toml = { workspace = true }

[dev-dependencies]
tempfile = "3"
