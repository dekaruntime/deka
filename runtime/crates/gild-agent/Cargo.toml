[package]
name = "gild-agent"
version = "0.1.0"
edition = "2024"

[[bin]]
name = "gild-agent"
path = "src/main.rs"

[dependencies]
anyhow = "1"
libc = "0.2"
rand = "0.8"
regex = "1"
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
sha2 = "0.10"
tokio = { workspace = true, features = ["full"] }
