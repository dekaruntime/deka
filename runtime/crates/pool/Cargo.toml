[package]
name = "pool"
version = "0.19.1"
edition = "2024"

[dependencies]
nanoid = { workspace = true }
core_affinity = { workspace = true }
deno_core = { workspace = true }
deno_error = { workspace = true }
libc = "0.2"
num_cpus = { workspace = true }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
tokio = { workspace = true, features = ["full"] }
tracing = "0.1"
deka-stdio = { path = "../stdio", package = "stdio" }
phpx_js = { path = "../phpx_js" }
runtime_core = { path = "../runtime_core" }

# Validation
swc_common = { workspace = true }
swc_ecma_ast = { workspace = true }
swc_ecma_parser = { workspace = true, features = ["typescript"] }
swc_ecma_visit = { workspace = true }

redis = { workspace = true }
reqwest = { version = "0.11", default-features = false, features = ["blocking", "json", "rustls-tls"] }
deka-validation = { path = "../deka-validation" }
deka-shard = { path = "../shard" }

[dev-dependencies]
tempfile = "3"
platform_server = { path = "../platform_server" }

[target.'cfg(target_os = "macos")'.dependencies]
mach2 = "0.6.0"
