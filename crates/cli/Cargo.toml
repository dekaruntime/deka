[package]
name = "cli"
version.workspace = true
edition = "2024"

[features]
default = ["native"]
native = [
  "dep:compile",
  "dep:pm",
  "dep:runtime",
  "dep:dev",
  "dep:pool",
  "dep:introspect",
  "dep:tokio",
  "dep:postgres",
  "dep:deka_host",
  "dep:rusqlite",
  "dep:deno_task_shell",
  "dep:ctrlc",
]
lsp = ["dep:deka-lsp"]

[dependencies]
deka-modules = "0.2.0"
serve = { path = "../serve" }
compiler = { path = "../compiler" }
run = { path = "../run" }
security = { path = "../security" }
runtime = { path = "../runtime", optional = true }
dev = { path = "../dev", optional = true }
pool = { path = "../pool", optional = true }
runtime_core = { path = "../runtime_core" }
compile = { path = "../compile", optional = true }
core = { path ="../core" }
stdio = "0.4.0"
introspect = { path = "../introspect", optional = true }
wasm_cli = { path = "../wasm_cli" }
pm = { workspace = true, optional = true }
anyhow = "1.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
reqwest = { version = "0.13", features = ["blocking", "form", "json"] }
tokio = { version = "1.35", features = ["rt-multi-thread", "net", "io-util"], optional = true }
postgres = { version = "0.19", optional = true }
deka-lsp = { version = "0.1.0", optional = true }
deka_host = { path = "../deka_host", optional = true, default-features = false, features = ["runtime"] }
rusqlite = { version = "0.32", optional = true }
sha2 = "0.10"
ctrlc = { version = "3", optional = true }
deno_task_shell = { version = "0.29.0", optional = true }
glob = "0.3.1"
serde_yaml = "0.9"
libc = "0.2"
tempfile = "3.23.0"
flate2 = "1.0"
tar = "0.4"

[dev-dependencies]
permissions = { path = "../permissions" }
tempfile = "3.23.0"
flate2 = "1.0"
base64 = "0.22"
# deka#755/RFD 27: grant fixtures need the fsGraph digest the lockfile pins,
# exactly as `deka install` computes it.
deka_host = { path = "../deka_host", default-features = false, features = ["runtime"] }
# deka#797: the grant-table plumbing e2e serves the deka.gg registry + R2 CDN
# shape from a local fixture server and runs the real `deka add` against it.
axum = "0.7"
