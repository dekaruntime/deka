[package]
name = "cli"
version.workspace = true
edition = "2024"

[features]
default = ["native"]
native = [
  "dep:dev",
  "dep:compile",
  "dep:compiler",
  "dep:runtime",
  "dep:introspect",
  "dep:deka-build",
  "dep:deka-cache",
  "dep:deka-task",
  "dep:deka-test",
  "dep:deka-deploy",
  "dep:deka-registry",
  "dep:self_cmd",
]
dev-server = ["native", "dev/dev-server"]
lsp = ["compiler/lsp"]

[dependencies]
serve = { path = "../serve" }
run = { path = "../run" }
core = { path = "../core" }
stdio = "0.4.0"
wasm_cli = { path = "../wasm_cli" }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
pm = { workspace = true }
deka-db = { path = "../deka_db" }
compile = { path = "../compile", optional = true }
compiler = { path = "../compiler", optional = true }
runtime = { path = "../runtime", optional = true }
dev = { path = "../dev", optional = true }
runtime_core = { path = "../runtime_core" }
introspect = { path = "../introspect", optional = true }
deka-build = { path = "../deka_build", optional = true }
deka-cache = { path = "../deka_cache", optional = true }
deka-task = { path = "../deka_task", optional = true }
deka-test = { path = "../deka_test", optional = true }
deka-deploy = { path = "../deka_deploy", optional = true }
deka-registry = { path = "../deka_registry", optional = true }
self_cmd = { path = "../self_cmd", optional = true }

[dev-dependencies]
permissions = { path = "../permissions" }
tempfile = "3.23.0"
flate2 = "1.0"
base64 = "0.22"
deka_host = { path = "../deka_host", default-features = false, features = ["runtime"] }
axum = "0.7"
reqwest = { version = "0.13", features = ["blocking", "json"] }
tungstenite = { version = "0.24", default-features = false, features = ["handshake"] }
sha2 = "0.10"
tar = "0.4"
tokio = { workspace = true }
pool = { path = "../pool" }
deka-modules = "0.3.0"
deka-db = { path = "../deka_db" }
pm = { workspace = true }
self_cmd = { path = "../self_cmd" }
deka-registry = { path = "../deka_registry" }
deka-deploy = { path = "../deka_deploy" }
deka-cache = { path = "../deka_cache" }
tungstenite = "0.24"
