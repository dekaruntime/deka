[package]
name = "cli"
version.workspace = true
edition = "2024"

[features]
default = ["native", "dev-server"]
native = [
  "dep:dev",
  "dep:compile",
  "dep:compiler",
  "dep:runtime",
  "dep:introspect",
  "dep:deka-build",
  "dep:deka-cache",
  "dep:deka-task",
  "dep:deka-test",
  "dep:deka-deploy",
  "dep:deka-registry",
  "dep:self_cmd",
]
dev-server = ["native", "dev/dev-server"]
lsp = ["compiler/lsp"]
# deka#992: self-update is deferred until closer to MVP; off by default.
# Forwards to self_cmd, which gates `self update`/`self monitor` and the
# pm::releases check-latest path behind the same flag.
self-update = ["self_cmd/self-update"]

[dependencies]
serve = { path = "../serve" }
run = { path = "../run" }
core = { path = "../core" }
stdio = "0.4.0"
wasm_cli = { path = "../wasm_cli" }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
pm = { workspace = true }
deka-db = { path = "../deka_db" }
compile = { path = "../compile", optional = true }
compiler = { path = "../compiler", optional = true }
runtime = { path = "../runtime", optional = true }
dev = { path = "../dev", optional = true }
runtime_core = { path = "../runtime_core" }
introspect = { path = "../introspect", optional = true }
deka-build = { path = "../deka_build", optional = true }
deka-cache = { path = "../deka_cache", optional = true }
deka-task = { path = "../deka_task", optional = true }
deka-test = { path = "../deka_test", optional = true }
deka-deploy = { path = "../deka_deploy", optional = true }
deka-registry = { path = "../deka_registry", optional = true }
self_cmd = { path = "../self_cmd", optional = true }

[dev-dependencies]
permissions = { path = "../permissions" }
tempfile = "3.23.0"
flate2 = "1.0"
base64 = "0.22"
deka_host = { path = "../deka_host", default-features = false, features = ["runtime"] }
axum = "0.7"
reqwest = { version = "0.13", features = ["blocking", "json"] }
tungstenite = { version = "0.24", default-features = false, features = ["handshake"] }
sha2 = "0.10"
tar = "0.4"
tokio = { workspace = true }
pool = { path = "../pool" }
deka-modules = "0.3.0"
deka-db = { path = "../deka_db" }
pm = { workspace = true }
# ambient_environment.rs pins self_cmd::update/self_cmd::monitor config
# resolution directly, so this test-only edge enables the feature even
# though the shipped `cli` binary (built without --features self-update)
# does not compile those modules in.
self_cmd = { path = "../self_cmd", features = ["self-update"] }
deka-registry = { path = "../deka_registry" }
deka-deploy = { path = "../deka_deploy" }
deka-cache = { path = "../deka_cache" }
