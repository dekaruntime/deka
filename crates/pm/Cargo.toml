[package]
name = "pm"
version.workspace = true
edition = "2024"

[dependencies]
deka-modules = "0.2.0"
permissions = { path = "../permissions" }
anyhow = "1.0"
base64 = "0.21"
dirs = "5"
reqwest = { version = "0.13", features = ["blocking", "json"] }
sha2 = "0.10"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tempfile = "3.6"
json5 = "1.3"
semver = "1.0"
tokio = { version = "1.35", features = ["rt-multi-thread", "macros", "sync", "net"] }
deka_host = { path = "../deka_host", default-features = false, features = ["runtime"] }

swc_ecma_codegen = "21.0.0"
swc_ecma_transforms_base = "34.0.0"
swc_ecma_transforms_typescript = "37.0.0"
swc_common.workspace = true
swc_ecma_ast.workspace = true
swc_ecma_parser.workspace = true
swc_ecma_visit.workspace = true
flate2 = "1.0"
tar = "0.4"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[dev-dependencies]
axum = "0.7"
