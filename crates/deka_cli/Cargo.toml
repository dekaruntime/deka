[package]
name = "deka_cli"
version.workspace = true
edition = "2024"
publish = false

[features]
default = ["desktop"]
desktop = ["deka_vm/gpu", "deka_native_ui/gpu"]

[dependencies]
deka-cli-core = { version = "0.6.0", default-features = false, features = ["registry"] }
deka_executable = { path = "../deka_executable" }
deka_vm = { path = "../deka_vm", features = ["compiler", "host", "ui"] }
deka_native_ui = { path = "../deka_native_ui" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt", "time"] }
tempfile = "3.23"
reqwest = { version = "0.13", features = ["blocking", "json"] }
flate2 = "1"
tar = "0.4"
semver = "1"
sha2 = "0.10"

[[bin]]
name = "deka"
path = "src/main.rs"
