[package]
name = "deka-ui-dev"
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"
publish = false

[[bin]]
name = "cargo-deka"
path = "src/main.rs"

[dependencies]
deka_native_ir = { package = "deka-ui-core", path = "../deka_native_ir", features = ["hot-reload"] }
serde_json = "1"
ctrlc = "3"
