[package]
name = "deka-db"
version.workspace = true
edition = "2024"

[lib]
path = "src/lib.rs"

[dependencies]
deka-cli-core = { version = "0.5.0", default-features = false, features = ["registry"] }
stdio = "0.4.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
postgres = "0.19"
rusqlite = "0.32"
