[package]
name = "deka-cache"
version.workspace = true
edition = "2024"

[dependencies]
deka-cli-core = { version = "0.5.0", default-features = false, features = ["registry"] }
compiler = { path = "../compiler" }
run = { path = "../run" }
serve = { path = "../serve" }
stdio = "0.4.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"

[dev-dependencies]
tempfile = "3.23.0"
