[package]
name = "pool"
version.workspace = true
edition = "2024"

[dependencies]
nanoid = { workspace = true }
core_affinity = { workspace = true }
deno_core = { workspace = true }
deno_error = { workspace = true }
libc = "0.2"
num_cpus = { workspace = true }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
tokio = { workspace = true, features = ["full"] }
tracing = "0.1"
deka-stdio = { version = "0.4.0", package = "stdio" }
deka_ui = { path = "../deka_ui" }
runtime_core = { path = "../runtime_core" }

# Validation
swc_common = { workspace = true }
swc_ecma_ast = { workspace = true }
swc_ecma_parser = { workspace = true, features = ["typescript"] }
swc_ecma_visit = { workspace = true }

reqwest = { version = "0.13", default-features = false, features = ["blocking", "json", "rustls"] }
deka-validation = { version = "0.2", features = ["wasm"] }
# Staged catalog compiles verify rewritten dependency packages against the
# real deka.lock with the same integrity hashes `deka install` pins.
deka_host = { path = "../deka_host", default-features = false, features = ["runtime"] }

[dev-dependencies]
tempfile = "3"
platform_server = { path = "../platform_server" }
# RFD 27 grant fixtures: compute the fsGraph digest the lockfile pins, exactly
# as `deka install` does (crates/pm), so grant-table digests match on disk.

[target.'cfg(target_os = "macos")'.dependencies]
mach2 = "0.6.0"
