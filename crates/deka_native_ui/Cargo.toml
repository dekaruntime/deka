[package]
name = "deka_native_ui"
version.workspace = true
edition = "2024"
license = "Apache-2.0"
publish = false

[features]
default = []
gpu = ["dep:gpui", "dep:image"]
program = ["deka_native_ir/program"]
runtime-shaders = ["gpu", "gpui/runtime_shaders"]

[dependencies]
deka_native_ir = { git = "https://github.com/dekaruntime/dsc", rev = "2588f05281a6d384276ef87c41706d65786096ab" }
gpui = { version = "=0.2.2", optional = true }

fontdue = "0.9.3"
serde = { version = "1", features = ["derive"] }
taffy = { version = "=0.9.0", default-features = false, features = ["std", "taffy_tree", "flexbox"] }
image = { version = "0.25", default-features = false, optional = true }
