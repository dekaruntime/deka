[package]
name = "deka-ui-macros"
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"
description = "Internal part of deka-ui: the view! and #[component] macros. Use the deka-ui crate."
repository = "https://github.com/dekaruntime/deka"
homepage = "https://deka.gg"
readme = false

[lib]
proc-macro = true

[features]
hot-reload = ["deka_native_ir/hot-reload"]

[dependencies]
proc-macro2 = { version = "1", features = ["span-locations"] }
quote = "1"
syn = { version = "3", features = ["full", "visit-mut"] }
rstml = "=0.13.1"
deka_native_ir = { package = "deka-ui-core", version = "0.1.0", path = "../deka_native_ir" }

[dev-dependencies]
bumpalo = "3"
deka_syntax = { path = "../deka_syntax" }
serde_json = "1"
