[package]
name = "deka-registry"
version.workspace = true
edition = "2024"

[dependencies]
deka-cli-core = { version = "0.5.0", default-features = false, features = ["registry"] }
stdio = "0.4.0"
anyhow = "1.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
reqwest = { version = "0.13", features = ["blocking", "form", "json"] }
tokio = { version = "1.35", features = ["rt-multi-thread"] }
deka-modules = "0.2.0"

[dev-dependencies]
tempfile = "3.23.0"
