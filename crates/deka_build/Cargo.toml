[package]
name = "deka-build"
version.workspace = true
edition = "2024"

[dependencies]
deka-cli-core = { version = "0.5.0", default-features = false, features = ["registry"] }
compiler = { path = "../compiler" }
runtime = { path = "../runtime" }
runtime_core = { path = "../runtime_core" }
pool = { path = "../pool" }
stdio = "0.4.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
deka-modules = "0.2.0"
tempfile = "3.23.0"
