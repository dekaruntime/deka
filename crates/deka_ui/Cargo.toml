[package]
name = "deka-ui"
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"
publish = false

[features]
default = ["desktop"]
desktop = ["deka_native_ui/gpu"]

[dependencies]
deka-ui-macros = { path = "../deka_ui_macros" }
deka_native_ir = { path = "../deka_native_ir" }
deka_native_ui = { path = "../deka_native_ui" }

[[example]]
name = "counter"
required-features = ["desktop"]

[[example]]
name = "counter_macro"
required-features = ["desktop"]

[dev-dependencies]
deka_vm = { path = "../deka_vm", features = ["compiler", "host", "ui"] }
serde_json = "1"

[[example]]
name = "tour-arrays"
path = "examples/tour/arrays.rs"
required-features = ["desktop"]

