[package]
name = "deka-ui"
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"
publish = false

[features]
default = ["desktop"]
desktop = ["deka_native_ui/gpu"]
web = ["dep:wasm-bindgen", "dep:serde_json", "dep:serde"]
tour = []
web-test = ["web"]
hot-reload = ["dep:deka-ui-hot-reload", "deka-ui-macros/hot-reload", "deka_native_ir/hot-reload"]

[dependencies]
deka-ui-hot-reload = { path = "../deka_ui_hot_reload", optional = true }
serde_json = { version = "1", optional = true }
serde = { version = "1", features = ["derive"], optional = true }
deka-ui-macros = { path = "../deka_ui_macros" }
deka_native_ir = { path = "../deka_native_ir" }
deka_native_ui = { path = "../deka_native_ui" }

[[example]]
name = "counter"
required-features = ["desktop"]

[[example]]
name = "counter_macro"
required-features = ["desktop"]

[dev-dependencies]
trybuild = "1"
deka_vm = { path = "../deka_vm", features = ["compiler", "host", "ui"] }
serde_json = "1"

