[package]
name = "deka-deploy"
version.workspace = true
edition = "2024"

[dependencies]
deka-cli-core = { version = "0.5.0", default-features = false, features = ["registry"] }
stdio = "0.4.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde_yaml = "0.9"
tokio = { version = "1.35", features = ["rt-multi-thread", "net", "io-util"] }
