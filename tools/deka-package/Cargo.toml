[package]
name = "dvm-package"
version = "0.1.0"
edition = "2024"
publish = false

[workspace]

[dependencies]
deka_vm = { path = "../../crates/deka_vm", features = ["compiler", "ui"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri-bundler = "=2.9.4"

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
strip = true
