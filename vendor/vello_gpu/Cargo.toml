# deka's fork of vello_gpu 0.3.0 (upstream: https://github.com/linebender/vello,
# commit f3000c8d, see .cargo_vcs_info.json). Wired in through the workspace's
# [patch.crates-io]. The whole delta against the crates.io release is
# vendor/vello_gpu.diff; everything it adds is marked "Fork (deka)" in the source:
#   * `multithreading` feature: deferred path strips generated on a rayon pool
#     (Scene::set_parallelism), merged in submission order; byte-identical output.
#   * Scene::fill_shape / stroke_shape: path elements straight into the queue.
#   * alpha and strip uploads through a reused wgpu StagingBelt.
#   * panics turned into errors or warnings (pixmap image sources, mask layers),
#     and Renderer::try_upload_image (a full atlas is an error, not a panic).
# Below is the normalized manifest from crates.io; the dev-dependencies are
# dropped because the crate's own tests and examples are not vendored.

[package]
edition = "2024"
rust-version = "1.89"
name = "vello_gpu"
version = "0.3.0"
build = false
autolib = false
autobins = false
autoexamples = false
autotests = false
autobenches = false
description = "A GPU renderer for Vello with CPU-side preprocessing."
readme = "README.md"
keywords = [
    "2d",
    "vector-graphics",
]
categories = [
    "rendering",
    "graphics",
]
license = "Apache-2.0 OR MIT"
repository = "https://github.com/linebender/vello"
resolver = "2"

[package.metadata.docs.rs]
all-features = true
default-target = "x86_64-unknown-linux-gnu"
targets = ["wasm32-unknown-unknown"]

[features]
default = [
    "wgpu",
    "wgpu_default",
    "text",
]
libm = [
    "vello_common/libm",
    "glifo?/libm",
]
probe = ["vello_common/probe"]
std = [
    "vello_common/std",
    "glifo?/std",
]
# Fork (deka): parallel strip generation on a persistent
# rayon pool (as in vello_cpu's `multithreading`).
multithreading = [
    "std",
    "dep:rayon",
]
text = [
    "dep:glifo",
    "glifo/std",
]
webgl = [
    "dep:js-sys",
    "dep:web-sys",
    "dep:vello_gpu_shaders",
    "vello_gpu_shaders/glsl",
]
wgpu = [
    "dep:wgpu",
    "dep:vello_gpu_shaders",
]
wgpu_default = [
    "wgpu",
    "wgpu/default",
]

[lib]
name = "vello_gpu"
path = "src/lib.rs"

[[example]]
name = "render_to_file"
path = "examples/render_to_file.rs"
required-features = ["wgpu"]

[dependencies.bytemuck]
version = "1.25.0"
features = [
    "derive",
    "derive",
]

[dependencies.glifo]
version = "0.4.0"
optional = true
default-features = false

[dependencies.hashbrown]
version = "0.17.1"
features = ["default-hasher"]
default-features = false

[dependencies.js-sys]
version = "0.3.92"
optional = true

[dependencies.log]
version = "0.4.29"

[dependencies.rayon]
version = "1.12.0"
optional = true

[dependencies.thiserror]
version = "2.0.18"
default-features = false

[dependencies.vello_common]
version = "0.3.0"
features = ["std"]
default-features = false

[dependencies.vello_gpu_shaders]
version = "0.3.0"
optional = true

[dependencies.web-sys]
version = "0.3.92"
features = [
    "HtmlCanvasElement",
    "WebGl2RenderingContext",
    "WebGlContextAttributes",
    "WebGlProgram",
    "WebGlUniformLocation",
    "WebGlBuffer",
    "WebGlShader",
    "WebGlSync",
    "WebGlTexture",
    "WebGlFramebuffer",
    "WebGlRenderbuffer",
    "WebGlVertexArrayObject",
]
optional = true

[dependencies.wgpu]
version = "30.0.0"
features = [
    "std",
    "wgsl",
]
optional = true
default-features = false

[lints.clippy]
allow_attributes_without_reason = "warn"
cargo_common_metadata = "warn"
cast_possible_truncation = "warn"
collection_is_never_read = "warn"
dbg_macro = "warn"
debug_assert_with_mut_call = "warn"
default_trait_access = "warn"
doc_markdown = "warn"
fn_to_numeric_cast_any = "warn"
infinite_loop = "warn"
large_stack_arrays = "warn"
mismatching_type_param_order = "warn"
missing_assert_message = "warn"
missing_fields_in_debug = "warn"
negative_feature_names = "warn"
redundant_feature_names = "warn"
same_functions_in_if_condition = "warn"
semicolon_if_nothing_returned = "warn"
should_panic_without_expect = "warn"
todo = "warn"
too_many_arguments = "allow"
unseparated_literal_suffix = "warn"
use_self = "warn"
wildcard_dependencies = "warn"

[lints.rust]
elided_lifetimes_in_paths = "warn"
keyword_idents_2024 = "forbid"
missing_debug_implementations = "warn"
missing_docs = "warn"
non_ascii_idents = "forbid"
non_local_definitions = "forbid"
trivial_numeric_casts = "warn"
unnameable_types = "warn"
unreachable_pub = "warn"
unsafe_op_in_unsafe_fn = "forbid"
unused_import_braces = "warn"
unused_lifetimes = "warn"
unused_macro_rules = "warn"
unused_qualifications = "warn"

[lints.rust.unexpected_cfgs]
level = "warn"
priority = 0
check-cfg = [
    "cfg(disable_dispatch_sse4_2)",
    "cfg(disable_dispatch_avx2)",
    "cfg(disable_dispatch_avx512)",
]
