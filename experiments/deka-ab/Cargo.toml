[package]
name = "deka-ab"
version = "0.0.0"
edition = "2024"
license = "Apache-2.0"
publish = false
description = "Spike phase 2: deka_native_ui on GPUI vs on winit + wgpu + vello + parley. Not product code."

# Standalone workspace: not a deka workspace member; deka's code paths are untouched.
[workspace]

[features]
# Exactly one backend per binary, so each binary's size excludes the other stack.
gpui-backend = ["dep:gpui", "dep:image", "dep:core-text", "dep:core-graphics", "dep:core-foundation"]
# vello's GPU bump counters (adds a readback per frame; diagnostics only).
diag = ["vello-backend", "vello/debug_layers"]
vello-backend = ["dep:winit", "dep:vello", "dep:wgpu", "dep:parley", "dep:arboard", "dep:pollster"]

[dependencies]
# deka main's UI crate, no features: Scene, layout (taffy), fontdue text, world.
deka_native_ui = { path = "../../crates/deka_native_ui" }
libc = "0.2"
png = "0.18"

[target.'cfg(target_os = "macos")'.dependencies]
# MTLDevice.currentAllocatedSize for both backends (same objc2-metal wgpu-hal uses).
objc2-metal = { version = "0.3.2", features = ["MTLDevice"] }

# Backend A: what deka ships today.
gpui = { version = "=0.2.2", features = ["runtime_shaders"], optional = true }
image = { version = "0.25", default-features = false, optional = true }
# Same versions GPUI already links (CoreText reference sheet only).
core-text = { version = "21", optional = true }
core-graphics = { version = "0.24", optional = true }
core-foundation = { version = "=0.10.0", optional = true }

# Backend B: small independent crates.
winit = { version = "=0.30.13", optional = true }
vello = { version = "=0.11.0", default-features = false, features = ["wgpu"], optional = true }
wgpu = { version = "=30.0.1", default-features = false, features = ["metal"], optional = true }
parley = { version = "=0.11.1", optional = true }
arboard = { version = "3.6", optional = true }
pollster = { version = "0.4", optional = true }

[[bin]]
name = "ab-gpui"
path = "src/bin_gpui.rs"
required-features = ["gpui-backend"]

[[bin]]
name = "ab-vello"
path = "src/bin_vello.rs"
required-features = ["vello-backend"]

[profile.release]
debug = false

# deka's shipped `native` profile, for the size comparison.
[profile.native]
inherits = "release"
opt-level = "s"
lto = true
codegen-units = 1
strip = true
