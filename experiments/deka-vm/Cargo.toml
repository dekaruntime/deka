[package]
name = "deka-vm-experiment"
version = "0.1.0"
edition = "2024"
publish = false
license = "MIT"

# Intentionally outside the product workspace: no V8 or release dependency changes.
[workspace]

[features]
default = []
compiler = ["dep:deka_syntax", "dep:bumpalo"]
host = ["dep:tokio"]
ui = ["dep:deka_native_ui", "dep:deka_native_ir"]
gpu = ["ui", "deka_native_ui/runtime-shaders"]
v8-control = ["dep:deno_core"]

[dependencies]
deka_native_ui = { git = "https://github.com/dekaruntime/deka", rev = "fd8e705d9622e19bf19fd78ad963971c15925c2d", optional = true }
deka_native_ir = { git = "https://github.com/dekaruntime/dsc", rev = "ff1d486813088df977aa5c3fe5400995ec67a710", optional = true }
deno_core = { version = "=0.412.0", optional = true }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
deka_syntax = { git = "https://github.com/dekaruntime/dsc", rev = "ff1d486813088df977aa5c3fe5400995ec67a710", optional = true }
bumpalo = { version = "3.16", optional = true }
tokio = { version = "1", features = ["rt", "time", "macros", "sync"], optional = true }

[[bin]]
name = "dvmc"
path = "src/bin/compiler.rs"
required-features = ["compiler"]

[[bin]]
name = "dvm"
path = "src/bin/runtime.rs"
required-features = ["host"]

[[bin]]
name = "dvm-core"
path = "src/bin/core.rs"

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
panic = "abort"
strip = true

[[bin]]
name = "dvm-ui"
path = "src/bin/ui.rs"
required-features = ["gpu"]

[[bin]]
name = "dvm-v8-ui"
path = "src/bin/v8_ui.rs"
required-features = ["gpu", "v8-control"]
