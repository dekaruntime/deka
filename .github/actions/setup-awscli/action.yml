name: Setup AWS CLI
description: Install the AWS CLI if it is not already present
runs:
  using: composite
  steps:
    - shell: bash
      run: |
        if command -v aws >/dev/null 2>&1; then
          echo "aws already installed: $(aws --version)"
          exit 0
        fi
        echo "aws not found; installing..."
        if [ "$(uname -s)" = "Linux" ]; then
          sudo apt-get update
          sudo apt-get install -y awscli
        else
          brew install awscli
        fi
