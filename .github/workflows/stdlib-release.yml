# SCCACHE IS REQUIRED FOR ALL RUST COMPILATION.
# EVERY CARGO BUILD/TEST/CHECK MUST RUN WITH RUSTC_WRAPPER=sccache. NO EXCEPTIONS.
# This workflow compiles NOTHING: it downloads prebuilt deka/dsc CLIs from
# releases.deka.gg and runs the package gate against them, so no cargo
# invocation (and therefore no sccache) appears here on purpose.

name: Stdlib package release (reusable)

# Shared release workflow for every dekaruntime/<pkg> stdlib repo
# (dekaruntime/deka#511). Called with `uses:` from each package repo's thin
# release.yml, which supplies the triggers:
#
#   pull_request (paths: deka.json) -> verify job: install @deka/* deps and
#     typecheck the package against the current released compiler BEFORE the
#     version bump can merge. Publishing must never be the first time this is
#     tested.
#   push to main -> publish job: only if the merge changed `version` in
#     deka.json, only if the commit belongs to a merged PR (a direct push
#     that bumps version fails with the reason), tags the merge commit,
#     packs, uploads to R2, verifies the object by ranged GET, and fires a
#     repository_dispatch at dekaruntime/website so the index updates in
#     minutes instead of on the 2-hourly cron.
#   workflow_dispatch with wiring_check_version -> upload a throwaway tarball
#     and delete it again, proving a never-released repo can see the runners,
#     the Cloudflare secrets, and the R2 write (STDLIB.md).
#
# Package repos call this with `secrets: inherit`; the secrets are the same
# org-level ones the old per-repo release.yml used (R2_ACCESS_KEY_ID,
# R2_SECRET_ACCESS_KEY, R2_ENDPOINT) plus WEBSITE_DISPATCH_TOKEN, a token
# able to post repository_dispatch to dekaruntime/website.

on:
  workflow_call:
    inputs:
      wiring_check_version:
        description: 'Throwaway version for a wiring check (workflow_dispatch only, e.g. 0.0.0-wiring-check)'
        required: false
        type: string

jobs:
  # Pre-merge gate for version-bump PRs. deka#512 made `check --as-package`
  # resolve the package's own version remotely, which left packages with
  # dependencies unverifiable; the fix (deka#513, released in 0.38.3) skips
  # linked packages, so this single gate now covers packages with and without
  # dependencies: it installs every declared @deka/* dependency from the
  # registry and typechecks the local tree as an installed consumer.
  verify:
    name: Install dependencies and typecheck (pre-merge gate)
    if: github.event_name == 'pull_request'
    runs-on: [self-hosted, macOS, ARM64]
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Install deka + dsc CLIs
        run: |
          VERSION="$(curl -sSf https://releases.deka.gg/latest.json | sed -n 's/.*"version": *"\([^"]*\)".*/\1/p' | head -1)"
          curl -sSfL "https://releases.deka.gg/${VERSION}/deka-darwin-arm64" -o /tmp/deka
          chmod +x /tmp/deka
          # deka check shells out to dsc since the toolchain split. dsc has its
          # own semver, so resolve it from its own latest release, never from
          # deka's version.
          DSC_TAG="$(curl -sSf https://api.github.com/repos/dekaruntime/dsc/releases/latest | sed -n 's/.*"tag_name": *"\([^"]*\)".*/\1/p' | head -1)"
          curl -sSfL "https://github.com/dekaruntime/dsc/releases/download/${DSC_TAG}/dsc-darwin-arm64" -o /tmp/dsc
          chmod +x /tmp/dsc

      - name: Verify package as an installed consumer
        run: DEKA_DSC=/tmp/dsc /tmp/deka check --as-package .

      - name: Typecheck package tests
        run: |
          if ls tests/*.ds >/dev/null 2>&1; then
            for t in tests/*.ds; do DEKA_DSC=/tmp/dsc /tmp/deka check "$t"; done
          else
            echo "no tests/*.ds; skipping"
          fi

  publish:
    name: Publish to R2 from merge commit
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    runs-on: [self-hosted, macOS, ARM64]
    # The org `release` environment scopes the R2 and dispatch secrets the
    # same way the old per-repo release.yml did.
    environment: release
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Install deka + dsc CLIs
        run: |
          VERSION="$(curl -sSf https://releases.deka.gg/latest.json | sed -n 's/.*"version": *"\([^"]*\)".*/\1/p' | head -1)"
          curl -sSfL "https://releases.deka.gg/${VERSION}/deka-darwin-arm64" -o /tmp/deka
          chmod +x /tmp/deka
          DSC_TAG="$(curl -sSf https://api.github.com/repos/dekaruntime/dsc/releases/latest | sed -n 's/.*"tag_name": *"\([^"]*\)".*/\1/p' | head -1)"
          curl -sSfL "https://github.com/dekaruntime/dsc/releases/download/${DSC_TAG}/dsc-darwin-arm64" -o /tmp/dsc
          chmod +x /tmp/dsc

      - name: Decide whether this event publishes
        id: decision
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          SHA: ${{ github.sha }}
          BEFORE: ${{ github.event.before }}
          WIRING_VERSION: ${{ inputs.wiring_check_version }}
        run: |
          set -euo pipefail
          MODULE="$(basename "$REPO")"
          echo "module=$MODULE" >> "$GITHUB_OUTPUT"

          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            if [ -z "$WIRING_VERSION" ]; then
              echo "::error::workflow_dispatch requires wiring_check_version."
              exit 1
            fi
            echo "version=$WIRING_VERSION" >> "$GITHUB_OUTPUT"
            echo "publish=true" >> "$GITHUB_OUTPUT"
            echo "reason=wiring check (throwaway version, deleted after verification)" 
            exit 0
          fi

          VERSION="$(python3 -c "import json;print(json.load(open('deka.json'))['version'])")"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

          # No-op unless the merge actually changed `version` in deka.json.
          PREV_VERSION=""
          if [[ "$BEFORE" != "0000000000000000000000000000000000000000" ]]; then
            PREV_VERSION="$(gh api "repos/$REPO/contents/deka.json?ref=$BEFORE" --jq '.content' | base64 -d | python3 -c "import json,sys;print(json.load(sys.stdin)['version'])")" || true
          fi
          if [ -n "$PREV_VERSION" ] && [ "$PREV_VERSION" = "$VERSION" ]; then
            echo "publish=false" >> "$GITHUB_OUTPUT"
            echo "reason=version $VERSION unchanged by this merge"
            exit 0
          fi

          # Sami's scope note (deka#511): publishing happens only for a MERGED
          # PR that bumps the version. A direct push to main that changes
          # `version` must not publish -- fail loudly and say why.
          PR_NUM="$(gh api "repos/$REPO/commits/$SHA/pulls" --jq '.[0].number' 2>/dev/null || true)"
          if [ -z "$PR_NUM" ] || [ "$PR_NUM" = "null" ]; then
            echo "::error::Direct push to main changed deka.json version to $VERSION. Direct pushes do not publish: the tag must be traceable to a reviewed, CI-green PR. Revert the version bump and land it via a PR (which runs the install + typecheck gate before merge)."
            exit 1
          fi
          if ! gh api "repos/$REPO/pulls/$PR_NUM/files" --jq '.[].filename' | grep -qx 'deka.json'; then
            echo "::error::Version changed to $VERSION on main, but no merged PR touched deka.json. Refusing to publish from an untraceable commit; land the bump via a PR."
            exit 1
          fi

          # Idempotency: a version that is already on the registry no-ops.
          # This is also what makes re-running a failed run safe.
          REGISTRY_JSON="$(curl -fsS "https://deka.gg/api/registry/$MODULE.json" || true)"
          if [ -n "$REGISTRY_JSON" ] && REGISTRY_JSON="$REGISTRY_JSON" VERSION="$VERSION" python3 -c "
          import json,os,sys
          meta=json.loads(os.environ['REGISTRY_JSON'])
          sys.exit(0 if os.environ['VERSION'] in meta.get('versions',{}) else 1)"; then
            echo "publish=false" >> "$GITHUB_OUTPUT"
            echo "reason=$MODULE@$VERSION is already on the registry"
            exit 0
          fi

          echo "publish=true" >> "$GITHUB_OUTPUT"
          echo "reason=publishing $MODULE@$VERSION from merge commit of PR #$PR_NUM"

      - name: Verify package as an installed consumer
        if: steps.decision.outputs.publish == 'true'
        run: DEKA_DSC=/tmp/dsc /tmp/deka check --as-package .

      - name: Tag the merge commit
        if: steps.decision.outputs.publish == 'true' && github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          SHA: ${{ github.sha }}
          MODULE: ${{ steps.decision.outputs.module }}
          VERSION: ${{ steps.decision.outputs.version }}
        run: |
          set -euo pipefail
          TAG="v$VERSION"
          if gh api "repos/$REPO/git/ref/tags/$TAG" >/dev/null 2>&1; then
            echo "tag $TAG already exists; not re-cutting it"
            exit 0
          fi
          # Annotated tag object, created by the workflow from the merge
          # commit -- never a hand-cut tag (deka#511).
          TAG_SHA="$(gh api "repos/$REPO/git/tags" -f tag="$TAG" -f message="release @deka/$MODULE $TAG" -f object="$SHA" -f type=commit --jq '.sha')"
          gh api "repos/$REPO/git/refs" -f ref="refs/tags/$TAG" -f sha="$TAG_SHA"
          echo "tagged $TAG at merge commit $SHA"

      - name: Clean and pack
        if: steps.decision.outputs.publish == 'true'
        env:
          MODULE: ${{ steps.decision.outputs.module }}
          VERSION: ${{ steps.decision.outputs.version }}
        run: |
          set -euo pipefail
          # Deterministic clean: the gate step can materialize ds_modules and
          # deka.json backups; never let them into the artifact (crypto-0.4.0
          # and jwt/auth-0.4.1 lessons -- tar excludes alone drifted per-repo).
          rm -rf ds_modules php_modules .deka.json-backup-*
          mkdir -p /tmp/dist
          tar -czf "/tmp/dist/${MODULE}-${VERSION}.tgz" \
            --exclude='.git' --exclude='ds_modules' --exclude='php_modules' \
            --exclude='.deka.json-backup-*' --exclude='.github' .
          echo "ARCHIVE=/tmp/dist/${MODULE}-${VERSION}.tgz" >> "$GITHUB_ENV"

      - name: Upload to R2 (S3 API)
        if: steps.decision.outputs.publish == 'true'
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: auto
          MODULE: ${{ steps.decision.outputs.module }}
          VERSION: ${{ steps.decision.outputs.version }}
        run: |
          if [ -z "$AWS_ACCESS_KEY_ID" ] || [ -z "$AWS_SECRET_ACCESS_KEY" ]; then
            echo "::error::R2 credentials missing. Add the org R2_ACCESS_KEY_ID / R2_SECRET_ACCESS_KEY / R2_ENDPOINT secrets to this repo's release environment (STDLIB.md)."
            exit 1
          fi
          aws s3api put-object \
            --endpoint-url "${{ secrets.R2_ENDPOINT }}" \
            --bucket deka-stdlib \
            --key "${MODULE}/${VERSION}/${MODULE}-${VERSION}.tgz" \
            --body "${ARCHIVE}" \
            --content-type application/gzip

      - name: Verify the upload by ranged GET
        if: steps.decision.outputs.publish == 'true'
        env:
          MODULE: ${{ steps.decision.outputs.module }}
          VERSION: ${{ steps.decision.outputs.version }}
        run: |
          # Plain HEAD on this bucket hangs or 403s; a ranged GET is the check
          # that matches what `deka add` does (STDLIB.md). A green upload step
          # is not evidence the object exists.
          CODE="$(curl -sS -r 0-0 -o /dev/null -w '%{http_code}' \
            "https://pub-6d81db17678348abba85f93fde4b4400.r2.dev/${MODULE}/${VERSION}/${MODULE}-${VERSION}.tgz")"
          if [ "$CODE" != "206" ] && [ "$CODE" != "200" ]; then
            echo "::error::ranged GET on the published tarball returned $CODE; expected 206. The object is not retrievable."
            exit 1
          fi
          echo "ranged GET ok ($CODE): ${MODULE}-${VERSION}.tgz is live"

      - name: Verify by reading the bytes back
        if: steps.decision.outputs.publish == 'true'
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: auto
          MODULE: ${{ steps.decision.outputs.module }}
          VERSION: ${{ steps.decision.outputs.version }}
        run: |
          aws s3api get-object \
            --endpoint-url "${{ secrets.R2_ENDPOINT }}" \
            --bucket deka-stdlib \
            --key "${MODULE}/${VERSION}/${MODULE}-${VERSION}.tgz" \
            /tmp/readback.tgz >/dev/null
          LOCAL=$(shasum -a 256 "${ARCHIVE}" | awk '{print $1}')
          REMOTE=$(shasum -a 256 /tmp/readback.tgz | awk '{print $1}')
          [ "$LOCAL" = "$REMOTE" ] || { echo "::error::R2 read-back hash mismatch"; exit 1; }
          echo "verified read-back hash: ${REMOTE}"

      - name: Delete wiring-check object
        # A throwaway wiring-check tarball must not linger: the website index
        # discovers versions by listing the bucket prefix, so anything left
        # under <name>/ would show up on the registry.
        if: steps.decision.outputs.publish == 'true' && github.event_name == 'workflow_dispatch'
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: auto
          MODULE: ${{ steps.decision.outputs.module }}
          VERSION: ${{ steps.decision.outputs.version }}
        run: |
          aws s3api delete-object \
            --endpoint-url "${{ secrets.R2_ENDPOINT }}" \
            --bucket deka-stdlib \
            --key "${MODULE}/${VERSION}/${MODULE}-${VERSION}.tgz" >/dev/null
          CODE="$(curl -sS -r 0-0 -o /dev/null -w '%{http_code}' \
            "https://pub-6d81db17678348abba85f93fde4b4400.r2.dev/${MODULE}/${VERSION}/${MODULE}-${VERSION}.tgz" || true)"
          echo "wiring-check object deleted (ranged GET now returns $CODE)"

      - name: Notify the website index
        if: steps.decision.outputs.publish == 'true' && github.event_name == 'push'
        env:
          GH_TOKEN: ${{ secrets.WEBSITE_DISPATCH_TOKEN }}
          MODULE: ${{ steps.decision.outputs.module }}
          VERSION: ${{ steps.decision.outputs.version }}
        run: |
          if [ -z "$GH_TOKEN" ]; then
            echo "::warning::WEBSITE_DISPATCH_TOKEN not set; skipping the website notification. The website's 2-hourly cron will pick the new version up eventually. Add a token able to post repository_dispatch to dekaruntime/website to make this immediate (STDLIB.md)."
            exit 0
          fi
          curl -sSL --fail-with-body -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            https://api.github.com/repos/dekaruntime/website/dispatches \
            -d "{\"event_type\":\"stdlib-published\",\"client_payload\":{\"package\":\"$MODULE\",\"version\":\"$VERSION\"}}"
          echo "dispatched stdlib-published to dekaruntime/website"
