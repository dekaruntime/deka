name: VM experiment
on:
  pull_request:
    paths:
      - 'experiments/deka-vm/**'
      - '.github/workflows/vm-experiment.yml'
permissions:
  contents: read
jobs:
  vm:
    runs-on: ubuntu-latest
    env:
      RUSTC_WRAPPER: sccache
      SCCACHE_GHA_ENABLED: 'true'
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: mozilla-actions/sccache-action@v0.0.9
      - run: sccache --show-stats
      - working-directory: experiments/deka-vm
        run: |
          cargo fmt --check
          cargo check --locked --workspace --all-targets --features compiler,host,ui,v8-control
          cargo clippy --locked --workspace --all-targets --features compiler,host,ui,v8-control -- -D warnings
          cargo test --locked --release --features compiler,host,ui,v8-control
          cargo build --locked --release --features compiler,host,ui,v8-control
          target/release/dvm examples/host.ds --grant-timer
          target/release/dvmc examples/host.ds target/host.dvm.json
          cargo build --locked --release --no-default-features --features host --bin dvm
          target/release/dvm target/host.dvm.json --grant-timer
          cargo build --locked --release --no-default-features --bin dvm-core

  desktop-build:
    runs-on: macos-15
    env:
      RUSTC_WRAPPER: sccache
      SCCACHE_GHA_ENABLED: 'true'
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: mozilla-actions/sccache-action@v0.0.9
      - run: sccache --show-stats
      - working-directory: experiments/deka-vm
        run: |
          cargo check --locked --workspace --all-targets --all-features
          cargo tree --locked --no-default-features --features compiler,gpu -e normal --prefix none > native-dependencies.txt
          if grep -Eq '^(deno_core|deno_v8|serde_v8|v8) ' native-dependencies.txt; then
            echo "VM-only feature set unexpectedly links a V8 dependency"
            exit 1
          fi
      - name: Package and exercise relocated native application
        env:
          CARGO_TARGET_DIR: ${{ github.workspace }}/experiments/deka-vm/target
        run: |
          cargo fmt --manifest-path experiments/deka-vm/packaging/Cargo.toml --check
          cargo clippy --locked --manifest-path experiments/deka-vm/packaging/Cargo.toml --workspace --all-targets --all-features -- -D warnings
          cargo build --locked --release --manifest-path experiments/deka-vm/Cargo.toml --no-default-features --features gpu --bin dvm-ui
          cargo build --locked --release --manifest-path experiments/deka-vm/packaging/Cargo.toml
          python3 experiments/deka-vm/packaging/test_bundle.py experiments/deka-vm/target/release/dvm-package experiments/deka-vm/target/release/dvm-ui experiments/deka-vm/examples/packaged-counter/deka.json experiments/deka-vm/target/package-tests
