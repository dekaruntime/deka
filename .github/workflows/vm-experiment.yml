name: Native runtime
on:
  workflow_call:
  pull_request:
    paths:
      - 'crates/deka_syntax/**'
      - 'crates/deka_fmt/**'
      - 'crates/deka_native_ir/**'
      - 'crates/deka_native_ui/**'
      - 'crates/deka_ui/**'
      - 'crates/deka_ui_tour/**'
      - 'scripts/build-rust-tour.py'
      - 'scripts/rust-tour-crates.txt'
      - 'scripts/compare-rust-tour.py'
      - 'scripts/rust-tour-browser/**'
      - 'crates/deka_ui_macros/**'
      - 'crates/deka_ui_hot_reload/**'
      - 'crates/deka_ui_dev/**'
      - 'scripts/rust-ui-hot-reload/**'
      - 'scripts/rust-ui-components/**'
      - 'crates/deka_vm/**'
      - 'crates/deka_cli/**'
      - 'crates/deka_executable/**'
      - 'crates/deka_native_web/**'
      - 'crates/corpus_gate/**'
      - 'vendor/**'
      - 'tools/deka-package/**'
      - 'tests/corpus-passing.txt'
      - 'scripts/testsuite-corpus-version'
      - 'tests/fixtures/diagnostics/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'run.sh'
      - 'scripts/test-rust-ui.sh'
      - '.github/workflows/vm-experiment.yml'
permissions:
  contents: read
jobs:
  vm:
    runs-on: ubuntu-latest
    env:
      RUSTC_WRAPPER: sccache
      SCCACHE_GHA_ENABLED: 'true'
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@1.96.0
        with:
          components: rustfmt, clippy
      - uses: mozilla-actions/sccache-action@v0.0.9
      - run: sccache --show-stats
      - name: Check and test the local frontend and runtime
        run: |
          cargo fmt -p deka-fmt -p deka_native_web -p deka_vm -p deka_native_ir -p deka_native_ui -p deka_cli -p deka_executable --check
          cargo check --locked -p deka_vm --all-targets --features compiler,host,ui
          cargo clippy --locked -p deka_vm --all-targets --features compiler,host,ui --no-deps -- -D warnings
          # The desktop window (winit + wgpu + vello_gpu) builds on Linux with no system
          # packages: X11, Wayland and Vulkan are loaded at run time. Its GPU tests run on macOS.
          cargo clippy --locked -p deka_native_ui --all-targets --features gpu --no-deps -- -D warnings
          cargo test --locked -p deka_native_ui --features gpu
          ./run.sh
          cargo test --locked --release -p deka_cli --no-default-features
      - name: Check Rust UI and compare every tour lesson with the VM
        run: |
          cargo fmt -p deka-ui -p deka-ui-macros -p deka-ui-tour --check
          cargo check --locked --release -p deka-ui -p deka-ui-macros -p deka-ui-tour --all-targets
          cargo clippy --locked --release -p deka-ui -p deka-ui-macros -p deka-ui-tour --all-targets --all-features --no-deps -- -D warnings
          ./scripts/test-rust-ui.sh
          python3 scripts/rust-ui-components/revert.py
          # A feature-less invocation must refuse to silently skip these gates.
          if cargo test --locked --release -p deka-ui --no-default-features --test required_features; then
            echo 'Missing-feature test incorrectly succeeded'
            exit 1
          fi
      - name: Native Rust UI hot reload (headless, debug integration)
        run: |
          cargo fmt -p deka-ui-hot-reload -p deka-ui-dev --check
          cargo clippy --locked -p deka-ui-hot-reload -p deka-ui-dev --all-targets --no-deps -- -D warnings
          cargo test --locked -p deka-ui-hot-reload -p deka_native_ir --features deka_native_ir/hot-reload
          cargo test --locked -p deka-ui --no-default-features --features hot-reload,tour,web --lib
          cargo build --locked -p deka-ui-dev
          python3 scripts/rust-ui-hot-reload/check.py
          python3 scripts/rust-ui-hot-reload/release.py
      - name: Compile source and execute without a compiler
        run: |
          cargo build --locked --release -p deka_vm --features compiler,host,ui
          target/release/dvm crates/deka_vm/examples/host.ds
          target/release/dvmc crates/deka_vm/examples/host.ds target/host.dvm.json
          cargo build --locked --release -p deka_vm --no-default-features --features host --bin dvm
          target/release/dvm target/host.dvm.json
          cargo build --locked --release -p deka_vm --no-default-features --bin dvm-core
  corpus-gate:
    runs-on: ubuntu-latest
    env:
      RUSTC_WRAPPER: sccache
      SCCACHE_GHA_ENABLED: 'true'
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@1.96.0
        with:
          targets: wasm32-unknown-unknown
          components: rustfmt
      - uses: mozilla-actions/sccache-action@v0.0.9
      - run: sccache --show-stats
      - name: Download and verify the corpus
        run: |
          version=$(sed -n '1p' scripts/testsuite-corpus-version)
          sha=$(sed -n '2p' scripts/testsuite-corpus-version)
          curl -fsSL "https://github.com/dekaruntime/testsuite/archive/${version}.tar.gz" -o corpus.tar.gz
          echo "${sha}  corpus.tar.gz" | sha256sum -c -
          mkdir -p tests/testsuite
          tar -xzf corpus.tar.gz -C tests/testsuite
      - name: Build the runtime and the gate
        # The gate runs programs, never a window: without the desktop feature the build needs no X11 libraries on the runner.
        run: |
          cargo fmt -p corpus_gate --check
          cargo test --locked --release -p corpus_gate
          cargo build --locked -p deka_cli --no-default-features
          cargo build --locked -p corpus_gate
      - name: Run the corpus gate
        run: |
          corpus_dir=$(echo tests/testsuite/*/corpus)
          target/debug/corpus-gate "$corpus_dir" tests/corpus-passing.txt target/debug/deka
          cargo run --locked --release -p corpus_gate --example formatter_gate -- target/debug/deka
          cargo run --locked --release -p deka-fmt --example audit -- "$corpus_dir" crates/deka_fmt/tests/fixtures/tour
      - uses: actions/setup-node@v5
        with:
          node-version: '24'
      - name: Test the actual browser formatter binding
        run: |
          cargo test --locked --release -p deka_native_web --test formatter
          cargo install --locked wasm-bindgen-cli --version 0.2.128
          python3 scripts/build-native-web.py --out target/formatter-web
          corpus_dir=$(echo tests/testsuite/*/corpus)
          cargo run --locked --release -p deka_native_web --example formatter_cases -- "$corpus_dir" crates/deka_fmt/tests/fixtures/tour > target/formatter-cases.jsonl
          node crates/deka_native_web/tests/formatter-wasm.mjs target/formatter-web target/formatter-cases.jsonl
  desktop-build:
    runs-on: macos-15
    env:
      RUSTC_WRAPPER: sccache
      SCCACHE_GHA_ENABLED: 'true'
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@1.96.0
        with:
          components: clippy, rustfmt
      - uses: mozilla-actions/sccache-action@v0.0.9
      - run: sccache --show-stats
      - name: Check desktop and engine dependency boundary
        run: |
          cargo check --locked -p deka_vm --all-targets --all-features
          cargo test --locked --release -p deka_cli --lib
          # macOS always ships Japanese and colour-emoji faces (the system font fallback test), and
          # every runner has a Metal device, so the window's pixel tests draw on a real GPU here.
          cargo test --locked --release -p deka_native_ui --features world-audio
          cargo test --locked --release -p deka-ui --features tour,web --test components_native
          cargo clippy --locked -p deka_native_ui --all-targets --all-features --no-deps -- -D warnings
          # GPUI is gone: no desktop crate may link it again.
          for package in deka_native_ui deka_vm deka_cli; do
            cargo tree --locked -p "$package" --all-features -e normal --prefix none > "tree-$package.txt"
            if grep -q '^gpui ' "tree-$package.txt"; then
              echo "$package depends on gpui"
              exit 1
            fi
          done
          cargo tree --locked -p deka_vm --no-default-features --features compiler,gpu -e normal --prefix none > native-dependencies.txt
          if grep -Eq '^(deno_core|deno_v8|serde_v8|v8) ' native-dependencies.txt; then
            echo "VM-only feature set unexpectedly links a V8 dependency"
            exit 1
          fi
      - name: Package and exercise relocated native application
        env:
          CARGO_TARGET_DIR: ${{ github.workspace }}/target
        run: |
          cargo fmt --manifest-path tools/deka-package/Cargo.toml --check
          cargo clippy --locked --manifest-path tools/deka-package/Cargo.toml --workspace --all-targets --all-features --no-deps -- -D warnings
          cargo build --locked --profile native -p deka_vm --no-default-features --features gpu --bin dvm-ui
          cargo build --locked --release --manifest-path tools/deka-package/Cargo.toml
          python3 tools/deka-package/test_bundle.py target/release/dvm-package target/native/dvm-ui crates/deka_vm/examples/packaged-counter/deka.json target/package-tests

  rust-tour-wasm:
    runs-on: ubuntu-latest
    env:
      RUSTC_WRAPPER: sccache
      SCCACHE_GHA_ENABLED: 'true'
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@1.96.0
        with:
          targets: wasm32-unknown-unknown
          components: clippy
      - uses: mozilla-actions/sccache-action@v0.0.9
      - run: sccache --show-stats
      - run: cargo install wasm-bindgen-cli --version 0.2.128 --locked
      - name: Build the compiled Rust tour and source/expectation manifests
        run: |
          cargo clippy --locked --target wasm32-unknown-unknown -p deka-ui-tour --no-deps -- -D warnings
          python3 scripts/build-rust-tour.py --out .tmp/rust-tour
          cargo clean -p deka-ui-tour --profile native --target wasm32-unknown-unknown
          python3 scripts/build-rust-tour.py --out .tmp/rust-tour-second
          python3 scripts/compare-rust-tour.py .tmp/rust-tour .tmp/rust-tour-second
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
      - name: Run the built tour in headless Chromium
        run: |
          npm ci --prefix scripts/rust-tour-browser
          scripts/rust-tour-browser/node_modules/.bin/playwright install --with-deps chromium --only-shell
          node scripts/rust-tour-browser/check.mjs .tmp/rust-tour
          python3 scripts/rust-ui-components/browser-revert.py .tmp/rust-tour
      - uses: actions/upload-artifact@v7
        with:
          name: rust-tour
          path: .tmp/rust-tour
          if-no-files-found: error
