# rfd#68: dispatch code for downstream repos, in one place, called by both
# release.yml (canary: create-deka-app + testsuite-site only) and promote.yml
# (stable: all five). Each target is opt-in via a boolean input so a caller
# only fires what applies to its channel.
name: Notify downstream

on:
  workflow_call:
    inputs:
      tag:
        description: "Tag being announced, e.g. v0.59.0-canary-d5661ed or v0.59.0"
        required: true
        type: string
      channel:
        description: "canary or stable"
        required: true
        type: string
      website:
        required: false
        type: boolean
        default: false
      create_deka_app:
        required: false
        type: boolean
        default: false
      testsuite_site:
        required: false
        type: boolean
        default: false
      draftwriter:
        required: false
        type: boolean
        default: false
      headless:
        required: false
        type: boolean
        default: false

jobs:
  notify:
    name: Dispatch downstream repos
    runs-on: ubuntu-latest
    steps:
      # Only the testsuite-site step below reads a file from this checkout
      # (scripts/testsuite-corpus-version), but it's cheap enough to always
      # do rather than gate a checkout step on one boolean input.
      - name: Checkout
        uses: actions/checkout@v5

      - name: Trigger website compiler sync
        if: ${{ inputs.website }}
        env:
          GH_TOKEN: ${{ secrets.DISPATCH_WEBSITE_SYNC_TOKEN }}
        run: |
          if [ -z "$GH_TOKEN" ]; then
            echo "DISPATCH_WEBSITE_SYNC_TOKEN not set; skipping cross-repo sync trigger."
            echo "The website's hourly sync fallback will pick up this release."
            exit 0
          fi
          curl -sSL --fail-with-body -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            https://api.github.com/repos/dekaruntime/website/actions/workflows/sync-deka-compiler.yml/dispatches \
            -d '{"ref":"main"}'

      - name: Trigger create-deka-app publish
        if: ${{ inputs.create_deka_app }}
        env:
          GH_TOKEN: ${{ secrets.CASCADE_DISPATCH_TOKEN }}
        run: |
          if [ -z "$GH_TOKEN" ]; then
            echo "::error::CASCADE_DISPATCH_TOKEN is not visible to this repo (org secret -> Repository access). The npm publish for ${{ inputs.tag }} was NOT triggered; create-deka-app's hourly schedule will publish it within the hour, but fix the secret."
            exit 1
          fi
          curl -sSL --fail-with-body -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            https://api.github.com/repos/dekaruntime/create-deka-app/dispatches \
            -d "{\"event_type\":\"deka-released\",\"client_payload\":{\"tag\":\"${{ inputs.tag }}\",\"channel\":\"${{ inputs.channel }}\"}}"

      - name: Trigger testsuite-site deploy
        if: ${{ inputs.testsuite_site }}
        env:
          GH_TOKEN: ${{ secrets.CASCADE_DISPATCH_TOKEN }}
        run: |
          set -euo pipefail
          if [ -z "$GH_TOKEN" ]; then
            echo "::error::CASCADE_DISPATCH_TOKEN is required to dispatch the testsuite-site deploy."
            echo "Add dekaruntime/deka to the org secret's repository access list before retrying."
            exit 1
          fi
          corpus_ref="$(sed -n '1p' scripts/testsuite-corpus-version)"
          corpus_sha="$(curl -fsSL \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/dekaruntime/testsuite/commits/${corpus_ref}" \
            | jq -r '.sha')"
          if ! [[ "$corpus_sha" =~ ^[a-f0-9]{40}$ ]]; then
            echo "::error::Could not resolve testsuite corpus pin ${corpus_ref} to a commit SHA."
            exit 1
          fi
          curl -sSL --fail-with-body -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            https://api.github.com/repos/dekaruntime/testsuite-site/dispatches \
            -d "{\"event_type\":\"corpus-updated\",\"client_payload\":{\"corpus_sha\":\"${corpus_sha}\",\"tag\":\"${{ inputs.tag }}\"}}"

      # Minor and major only. Patch releases do not get their own post; their
      # content belongs in the minor's. Stable-only: canaries never draft a
      # release note.
      - name: Trigger release-note draft
        if: ${{ inputs.draftwriter }}
        env:
          GH_TOKEN: ${{ secrets.CASCADE_DISPATCH_TOKEN }}
          TAG: ${{ inputs.tag }}
        run: |
          patch="${TAG##*.}"
          if [ "$patch" != "0" ]; then
            echo "$TAG is a patch release; release notes are written per minor."
            exit 0
          fi
          if [ -z "$GH_TOKEN" ]; then
            echo "CASCADE_DISPATCH_TOKEN not set; skipping release-note trigger."
            echo "Run draftwriter's draft.yml manually with tag=$TAG."
            exit 0
          fi
          curl -sSL --fail-with-body -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            https://api.github.com/repos/dekaruntime/draftwriter/dispatches \
            -d "{\"event_type\":\"runtime-published\",\"client_payload\":{\"tag\":\"$TAG\"}}"

      - name: Trigger headless compiler sync
        if: ${{ inputs.headless }}
        env:
          GH_TOKEN: ${{ secrets.CASCADE_DISPATCH_TOKEN }}
        run: |
          if [ -z "$GH_TOKEN" ]; then
            echo "CASCADE_DISPATCH_TOKEN not set; skipping cross-repo headless sync trigger."
            echo "The headless hourly sync fallback will pick up this release."
            exit 0
          fi
          curl -sSL --fail-with-body -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            https://api.github.com/repos/dekaruntime/headless/actions/workflows/sync-wasm.yml/dispatches \
            -d '{"ref":"main"}'
