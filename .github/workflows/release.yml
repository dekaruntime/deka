# SCCACHE IS REQUIRED FOR ALL RUST COMPILATION.
# EVERY CARGO BUILD/TEST/CHECK MUST RUN WITH RUSTC_WRAPPER=sccache. NO EXCEPTIONS.
#
# rfd#68: this workflow builds and publishes CANARIES ONLY. It never builds a
# plain vX.Y.Z tag and it never moves `latest.json` / `latest/`. A canary
# becomes stable only via promote.yml (Actions -> Promote -> Run workflow),
# which copies these same bytes to the stable path — there is no second
# build.
name: Release

on:
  # Normally started by tag-canary.yml's `gh workflow run release.yml --ref
  # <canary-tag>` after it pushes the tag (that push itself does not trigger
  # this workflow -- GITHUB_TOKEN pushes don't fire `on: push`). Also usable
  # by hand at an existing canary tag.
  workflow_dispatch:
  push:
    tags:
      - 'v*-canary-*'

permissions:
  contents: read

env:
  R2_BUCKET_RELEASES: "deka-releases"
  R2_BUCKET_WASM: "deka-wasm"

jobs:
  # Every other job reads TAG/BASE_VERSION/SHA7/COMMIT from here instead of
  # re-deriving them, and nothing else runs until this ref is proven to be a
  # real, matching canary.
  resolve:
    name: Resolve canary tag
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.resolve.outputs.tag }}
      version: ${{ steps.resolve.outputs.version }}
      base_version: ${{ steps.resolve.outputs.base_version }}
      sha7: ${{ steps.resolve.outputs.sha7 }}
      commit: ${{ steps.resolve.outputs.commit }}
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Where am I
        uses: ./.github/actions/where-am-i

      - name: Resolve and validate the canary tag
        id: resolve
        run: |
          set -euo pipefail
          TAG="${GITHUB_REF_NAME}"

          if [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::${TAG} looks like a stable tag. This workflow only builds canaries (vX.Y.Z-canary-<sha>) -- stable tags are created by promote.yml, which republishes an already-built canary instead of compiling a new one."
            exit 1
          fi

          if [[ ! "$TAG" =~ ^v([0-9]+\.[0-9]+\.[0-9]+)-canary-([0-9a-f]{7})$ ]]; then
            echo "::error::'${TAG}' is not a canary tag. Expected vX.Y.Z-canary-<7-hex-sha>, e.g. v0.59.0-canary-d5661ed."
            exit 1
          fi
          BASE_VERSION="${BASH_REMATCH[1]}"
          SHA7="${BASH_REMATCH[2]}"

          TREE_VERSION="$(scripts/runtime-version.sh)"
          if [[ "$TREE_VERSION" != "$BASE_VERSION" ]]; then
            echo "::error::canary tag ${TAG} names base version ${BASE_VERSION}, but the tagged tree is ${TREE_VERSION}."
            echo "Bump with scripts/bump-version.sh and merge that PR before the next canary."
            exit 1
          fi

          COMMIT="$(git rev-parse HEAD)"
          ACTUAL_SHA7="$(git rev-parse --short=7 HEAD)"
          if [[ "$ACTUAL_SHA7" != "$SHA7" ]]; then
            echo "::error::canary tag ${TAG} names commit ${SHA7}, but this ref resolves to ${ACTUAL_SHA7} (${COMMIT})."
            exit 1
          fi

          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
          echo "version=${TAG#v}" >> "$GITHUB_OUTPUT"
          echo "base_version=${BASE_VERSION}" >> "$GITHUB_OUTPUT"
          echo "sha7=${SHA7}" >> "$GITHUB_OUTPUT"
          echo "commit=${COMMIT}" >> "$GITHUB_OUTPUT"

  build-native-web:
    name: Build and exercise native browser runtime
    needs: resolve
    runs-on: ubuntu-latest
    env:
      RUSTC_WRAPPER: sccache
      SCCACHE_GHA_ENABLED: 'true'
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@1.96.0
        with:
          targets: wasm32-unknown-unknown
      - uses: mozilla-actions/sccache-action@v0.0.9
      - run: sccache --show-stats
      - uses: actions/setup-node@v5
        with:
          node-version: '24'
      - run: cargo install --locked wasm-bindgen-cli --version 0.2.128
      - name: Build versioned package
        run: python3 scripts/build-native-web.py --out dist/native-ui
      - name: Execute the distributable package
        run: node scripts/test-native-web-package.mjs dist/native-ui "${{ needs.resolve.outputs.base_version }}" "${{ needs.resolve.outputs.commit }}"
      - uses: actions/upload-artifact@v7
        with:
          name: deka-native-web
          path: dist/native-ui/*
          if-no-files-found: error
          retention-days: 1

  fetch-dsc-wasm:
    name: Fetch published dsc WASM
    needs: [resolve]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Where am I
        uses: ./.github/actions/where-am-i

      - name: Download dsc browser artifacts
        run: |
          mkdir -p dist/deka-compiler-wasm
          scripts/ci-install-dsc.sh "${{ github.workspace }}/.ci/dsc" \
            --wasm dist/deka-compiler-wasm

      - name: Upload WASM artifacts
        uses: actions/upload-artifact@v7
        with:
          name: deka-wasm
          path: dist/deka-compiler-wasm/*
          retention-days: 1

  build-cli-linux-x64:
    name: Build CLI (linux-x64)
    needs: [resolve]
    runs-on: ubuntu-latest
    environment: release
    env:
      SCCACHE_ENDPOINT: ${{ secrets.R2_ENDPOINT }}
      SCCACHE_REGION: auto
      SCCACHE_BUCKET: deka-sccache-linux-x64
      AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Where am I
        uses: ./.github/actions/where-am-i

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@1.96.0

      - name: Run sccache-cache
        uses: mozilla-actions/sccache-action@v0.0.9

      - name: Verify sccache can reach R2
        run: |
          command -v aws >/dev/null 2>&1 || pip install --break-system-packages awscli
          echo "SCCACHE_ENDPOINT=$SCCACHE_ENDPOINT"
          echo "SCCACHE_BUCKET=$SCCACHE_BUCKET"
          sccache --show-stats
          aws s3 ls "s3://${SCCACHE_BUCKET}/" --endpoint-url="${SCCACHE_ENDPOINT}"

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2

      - name: Build CLI
        env:
          RUSTC_WRAPPER: sccache
        run: cargo build --release -p cli

      # rfd#27 2026-09-16 amendment: deka-host.d.ds is generated from the same
      # compiled catalog the runtime executes, then published beside the binaries.
      - name: Build bridge_diff
        env:
          RUSTC_WRAPPER: sccache
        run: cargo build --release -p permissions --bin bridge_diff

      - name: Generate host declaration file
        run: |
          mkdir -p dist
          ./target/release/bridge_diff --dump-host-decl > dist/deka-host.d.ds
          [ -s dist/deka-host.d.ds ] || { echo "::error::deka-host.d.ds is empty"; exit 1; }

      - name: Upload host declaration artifact
        uses: actions/upload-artifact@v7
        with:
          name: deka-host-decl
          path: dist/deka-host.d.ds
          retention-days: 1

      - name: Prepare binary
        run: |
          mkdir -p dist
          cp target/release/cli dist/deka-linux-x64
          chmod +x dist/deka-linux-x64

      - name: Upload binary
        uses: actions/upload-artifact@v7
        with:
          name: deka-cli-linux-x64
          path: dist/deka-linux-x64
          retention-days: 1

  build-cli-darwin-x64:
    name: Build CLI (darwin-x64)
    needs: [resolve]
    runs-on: macos-15-intel
    environment: release
    env:
      SCCACHE_ENDPOINT: ${{ secrets.R2_ENDPOINT }}
      SCCACHE_REGION: auto
      SCCACHE_BUCKET: deka-sccache-darwin-x64
      AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Where am I
        uses: ./.github/actions/where-am-i

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@1.96.0

      - name: Run sccache-cache
        uses: mozilla-actions/sccache-action@v0.0.9

      - name: Verify sccache can reach R2
        run: |
          command -v aws >/dev/null 2>&1 || pip install --break-system-packages awscli
          echo "SCCACHE_ENDPOINT=$SCCACHE_ENDPOINT"
          echo "SCCACHE_BUCKET=$SCCACHE_BUCKET"
          sccache --show-stats
          aws s3 ls "s3://${SCCACHE_BUCKET}/" --endpoint-url="${SCCACHE_ENDPOINT}"

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2

      - name: Build CLI
        env:
          RUSTC_WRAPPER: sccache
        run: cargo build --release -p cli

      - name: Prepare binary
        run: |
          mkdir -p dist
          cp target/release/cli dist/deka-darwin-x64
          chmod +x dist/deka-darwin-x64

      - name: Upload binary
        uses: actions/upload-artifact@v7
        with:
          name: deka-cli-darwin-x64
          path: dist/deka-darwin-x64
          retention-days: 1

  build-cli-darwin-arm64:
    name: Build CLI (darwin-arm64)
    needs: [resolve]
    runs-on: macos-14
    environment: release
    env:
      SCCACHE_ENDPOINT: ${{ secrets.R2_ENDPOINT }}
      SCCACHE_REGION: auto
      SCCACHE_BUCKET: deka-sccache-darwin-arm64
      AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Where am I
        uses: ./.github/actions/where-am-i

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@1.96.0

      - name: Run sccache-cache
        uses: mozilla-actions/sccache-action@v0.0.9

      - name: Verify sccache can reach R2
        run: |
          command -v aws >/dev/null 2>&1 || pip install --break-system-packages awscli
          echo "SCCACHE_ENDPOINT=$SCCACHE_ENDPOINT"
          echo "SCCACHE_BUCKET=$SCCACHE_BUCKET"
          sccache --show-stats
          aws s3 ls "s3://${SCCACHE_BUCKET}/" --endpoint-url="${SCCACHE_ENDPOINT}"

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2

      - name: Build CLI
        env:
          RUSTC_WRAPPER: sccache
        run: cargo build --release -p cli

      - name: Prepare binary
        run: |
          mkdir -p dist
          cp target/release/cli dist/deka-darwin-arm64
          chmod +x dist/deka-darwin-arm64

      - name: Upload binary
        uses: actions/upload-artifact@v7
        with:
          name: deka-cli-darwin-arm64
          path: dist/deka-darwin-arm64
          retention-days: 1

  # rfd#68: replaces the old `test` job's in-tree `cargo test -p cli --test
  # compile_executable`. PR CI on the merge commit is now the unit-test gate
  # (ci.yml already runs this same test on ubuntu and macos-14); this job
  # proves the *shipped binary* on each host, with zero compilation -- ~30s
  # per platform instead of a from-scratch `cargo build`/`cargo test` matrix.
  smoke:
    name: Smoke test compiled executable (${{ matrix.platform }})
    needs: [resolve, build-cli-linux-x64, build-cli-darwin-x64, build-cli-darwin-arm64]
    strategy:
      fail-fast: true
      matrix:
        platform: [linux-x64, darwin-x64, darwin-arm64]
        include:
          - platform: linux-x64
            runner: ubuntu-latest
          - platform: darwin-x64
            runner: macos-15-intel
          - platform: darwin-arm64
            runner: macos-14
    runs-on: ${{ matrix.runner }}
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Where am I
        uses: ./.github/actions/where-am-i

      - name: Download built CLI
        uses: actions/download-artifact@v7
        with:
          name: deka-cli-${{ matrix.platform }}
          path: artifacts

      - name: Install pinned dsc
        run: scripts/ci-install-dsc.sh "${{ runner.temp }}/dsc-pinned"

      # Mirrors crates/cli/tests/compile_executable.rs exactly, but against
      # the built artifact and with no cargo/compilation involved: a real
      # source tree (with the checked-in @deka/io 0.1.1 fixture + its
      # deka.lock), a private copy of dsc that gets deleted with the source
      # dir, a codesign check on macOS, and a from-empty-environment run of
      # the compiled binary asserting exact stdout.
      - name: Smoke test compiled executable
        run: |
          set -euo pipefail
          CLI="$(pwd)/artifacts/deka-${{ matrix.platform }}"
          chmod +x "$CLI"

          SOURCE="$(mktemp -d "${{ runner.temp }}/smoke-src.XXXXXX")"
          DEST="$(mktemp -d "${{ runner.temp }}/smoke-dst.XXXXXX")"
          ELSEWHERE="$(mktemp -d "${{ runner.temp }}/smoke-run.XXXXXX")"

          mkdir -p "$SOURCE/ds_modules/@deka/io"
          cp crates/cli/tests/fixtures/package-cache/cache-entry/ds_modules/@deka/io/index.ds \
            "$SOURCE/ds_modules/@deka/io/index.ds"
          cp crates/cli/tests/fixtures/package-cache/cache-entry/ds_modules/@deka/io/deka.json \
            "$SOURCE/ds_modules/@deka/io/deka.json"
          cp crates/cli/tests/fixtures/package-cache/cache-entry/deka.lock \
            "$SOURCE/deka.lock"
          printf '{"dependencies":{"@deka/io":"0.1.1"}}' > "$SOURCE/deka.json"
          printf 'import { echo } from "io"\necho("hello from compiled Deka");\n' > "$SOURCE/hello.ds"

          # A private copy, exactly like the in-tree test: the compiler must
          # not be needed after this directory (and this copy) are gone.
          cp "${{ runner.temp }}/dsc-pinned" "$SOURCE/dsc"
          chmod +x "$SOURCE/dsc"

          EXECUTABLE="$DEST/hello"
          (cd "$SOURCE" && DEKA_DSC="$SOURCE/dsc" "$CLI" compile hello.ds --outfile "$EXECUTABLE")

          rm -rf "$SOURCE"

          if [ "${{ matrix.platform }}" != "linux-x64" ]; then
            codesign --verify --strict "$EXECUTABLE"
          fi

          set +e
          OUTPUT="$(cd "$ELSEWHERE" && env -i \
            PATH="$ELSEWHERE" \
            HOME="$ELSEWHERE" \
            DEKA_DSC="$ELSEWHERE/missing-dsc" \
            DEKA_NO_DSC=1 \
            "$EXECUTABLE")"
          STATUS=$?
          set -e

          if [ "$STATUS" -ne 0 ]; then
            echo "::error::compiled executable exited $STATUS (expected 0)"
            exit 1
          fi
          if [ "$OUTPUT" != "hello from compiled Deka" ]; then
            echo "::error::unexpected stdout: $(printf '%s' "$OUTPUT" | head -c 500)"
            exit 1
          fi
          echo "smoke test passed on ${{ matrix.platform }}"

  # Local runtime tests replace the retired external corpus release gate.
  runtime-validation:
    name: Validate native runtime
    needs: resolve
    uses: ./.github/workflows/vm-experiment.yml

  publish:
    name: Publish to R2
    needs: [resolve, build-native-web, fetch-dsc-wasm, build-cli-linux-x64, build-cli-darwin-x64, build-cli-darwin-arm64, smoke, runtime-validation]
    runs-on: ubuntu-latest
    environment: release
    permissions:
      contents: write
    env:
      R2_ENDPOINT: ${{ secrets.R2_ENDPOINT }}
      AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
      AWS_DEFAULT_REGION: auto
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Where am I
        uses: ./.github/actions/where-am-i

      - name: Download all artifacts
        uses: actions/download-artifact@v7
        with:
          path: artifacts
          pattern: deka-*

      - name: Install AWS CLI
        run: |
          command -v aws >/dev/null 2>&1 || pip install --break-system-packages awscli

      - name: Prepare release layout
        id: prepare
        run: |
          TAG="${{ needs.resolve.outputs.tag }}"
          VERSION="${{ needs.resolve.outputs.version }}"
          BASE_VERSION="${{ needs.resolve.outputs.base_version }}"
          COMMIT="${{ needs.resolve.outputs.commit }}"
          PUBLISHED_AT="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          DSC_VERSION="$(tr -d '[:space:]' < scripts/dsc-version)"

          mkdir -p "release/${TAG}"

          # CLI binaries
          for platform in linux-x64 darwin-x64 darwin-arm64; do
            src="artifacts/deka-cli-${platform}/deka-${platform}"
            dst="release/${TAG}/deka-${platform}"
            cp "${src}" "${dst}"
          done

          # Combined compiler/VM/renderer, copied unchanged on stable promotion.
          mkdir -p "release/${TAG}/native-ui"
          cp artifacts/deka-native-web/* "release/${TAG}/native-ui/"

          # Legacy WASM artifacts retained for CLI/downstream compatibility.
          cp artifacts/deka-wasm/deka_compiler.wasm "release/${TAG}/"
          cp artifacts/deka-wasm/deka_diagnostics.wasm "release/${TAG}/"

          # Host declaration file (rfd#27 2026-09-16 amendment)
          cp artifacts/deka-host-decl/deka-host.d.ds "release/${TAG}/"

          # Compute sha256s and sizes
          sha256() { sha256sum "$1" | awk '{print $1}'; }

          COMPILER_SHA256="$(sha256 "release/${TAG}/deka_compiler.wasm")"
          COMPILER_SIZE="$(stat -c%s "release/${TAG}/deka_compiler.wasm")"
          DIAGNOSTICS_SHA256="$(sha256 "release/${TAG}/deka_diagnostics.wasm")"
          DIAGNOSTICS_SIZE="$(stat -c%s "release/${TAG}/deka_diagnostics.wasm")"
          HOST_DECL_SHA256="$(sha256 "release/${TAG}/deka-host.d.ds")"
          CARGO_LOCK_SHA256="$(sha256sum Cargo.lock | awk '{print $1}')"

          LINUX_X64_SHA256="$(sha256 "release/${TAG}/deka-linux-x64")"
          DARWIN_X64_SHA256="$(sha256 "release/${TAG}/deka-darwin-x64")"
          DARWIN_ARM64_SHA256="$(sha256 "release/${TAG}/deka-darwin-arm64")"

          # Website-compatible compiler manifest
          jq -n \
            --arg version "${VERSION}" \
            --arg commit "${COMMIT}" \
            --arg cargo_lock "${CARGO_LOCK_SHA256}" \
            --arg sha256 "${COMPILER_SHA256}" \
            --argjson bytes "${COMPILER_SIZE}" \
            '{
              schemaVersion: 1,
              compiler: {
                name: "deka-browser-compiler",
                version: $version,
                sourceCommit: $commit,
                abiVersion: 2
              },
              producer: {
                schemaVersion: 1,
                target: "wasm32-unknown-unknown",
                cargoLockSha256: $cargo_lock
              },
              artifact: {
                file: "deka_compiler.wasm",
                sha256: $sha256,
                bytes: $bytes
              }
            }' > "release/${TAG}/deka-compiler-artifact.json"

          # Website-compatible diagnostics manifest
          jq -n \
            --arg commit "${COMMIT}" \
            --arg cargo_lock "${CARGO_LOCK_SHA256}" \
            --arg sha256 "${DIAGNOSTICS_SHA256}" \
            --argjson bytes "${DIAGNOSTICS_SIZE}" \
            '{
              schemaVersion: 1,
              diagnostics: {
                name: "deka_diagnostics",
                abiVersion: 1,
                sourceCommit: $commit
              },
              producer: {
                schemaVersion: 1,
                target: "wasm32-unknown-unknown",
                cargoLockSha256: $cargo_lock
              },
              artifact: {
                file: "deka_diagnostics.wasm",
                sha256: $sha256,
                bytes: $bytes
              }
            }' > "release/${TAG}/deka-diagnostics-artifact.json"

          # WASM metadata sidecars consumed by the website sync job
          jq -n \
            --arg artifact "deka_compiler.wasm" \
            --arg sha256 "${COMPILER_SHA256}" \
            --arg source_commit "${COMMIT}" \
            --arg target "wasm32-unknown-unknown" \
            --arg cargo_lock "${CARGO_LOCK_SHA256}" \
            --arg name "deka-browser-compiler" \
            --arg version "${VERSION}" \
            --argjson abi_version 2 \
            '{
              schema_version: 1,
              artifact: $artifact,
              sha256: $sha256,
              source_commit: $source_commit,
              target: $target,
              cargo_lock_sha256: $cargo_lock,
              compiler: { name: $name, version: $version, abi_version: $abi_version }
            }' > "release/${TAG}/deka_compiler.wasm.metadata.json"

          jq -n \
            --arg artifact "deka_diagnostics.wasm" \
            --arg sha256 "${DIAGNOSTICS_SHA256}" \
            --arg source_commit "${COMMIT}" \
            --arg target "wasm32-unknown-unknown" \
            --arg cargo_lock "${CARGO_LOCK_SHA256}" \
            --arg name "deka_diagnostics" \
            --argjson abi_version 1 \
            '{
              schema_version: 1,
              artifact: $artifact,
              sha256: $sha256,
              source_commit: $source_commit,
              target: $target,
              cargo_lock_sha256: $cargo_lock,
              adapter: { name: $name, abi_version: $abi_version }
            }' > "release/${TAG}/deka_diagnostics.wasm.metadata.json"

          # Release manifest consumed by the website sync job and by
          # promote.yml's gates. rfd#68 additions: channel, base_version,
          # dsc_version, promoted_from (always null here --
          # only promote.yml's rewrite of this same file sets it).
          jq -n \
            --arg version "${VERSION}" \
            --arg tag "${TAG}" \
            --arg commit "${COMMIT}" \
            --arg published_at "${PUBLISHED_AT}" \
            --arg linux_x64_sha "${LINUX_X64_SHA256}" \
            --arg darwin_x64_sha "${DARWIN_X64_SHA256}" \
            --arg darwin_arm64_sha "${DARWIN_ARM64_SHA256}" \
            --arg compiler_sha "${COMPILER_SHA256}" \
            --arg diagnostics_sha "${DIAGNOSTICS_SHA256}" \
            --arg host_decl_sha "${HOST_DECL_SHA256}" \
            --arg channel "canary" \
            --arg base_version "${BASE_VERSION}" \
            --arg dsc_version "${DSC_VERSION}" \
            '{
              version: $version,
              tag: $tag,
              commit: $commit,
              published_at: $published_at,
              channel: $channel,
              base_version: $base_version,
              dsc_version: $dsc_version,
              promoted_from: null,
              binaries: {
                "linux-x64": { name: "deka-linux-x64", sha256: $linux_x64_sha },
                "darwin-x64": { name: "deka-darwin-x64", sha256: $darwin_x64_sha },
                "darwin-arm64": { name: "deka-darwin-arm64", sha256: $darwin_arm64_sha }
              },
              wasm: {
                compiler: "deka_compiler.wasm",
                compiler_sha256: $compiler_sha,
                diagnostics: "deka_diagnostics.wasm",
                diagnostics_sha256: $diagnostics_sha
              },
              host_decl: {
                file: "deka-host.d.ds",
                sha256: $host_decl_sha
              }
            }' > "release/${TAG}/release.json"

          jq --arg sha "$(sha256 "release/${TAG}/native-ui/manifest.json")" \
            --argjson bytes "$(stat -c%s "release/${TAG}/native-ui/manifest.json")" \
            '.native_ui = {manifest: "native-ui/manifest.json", sha256: $sha, bytes: $bytes, abi: 1}' \
            "release/${TAG}/release.json" > "release/${TAG}/release.with-native.json"
          mv "release/${TAG}/release.with-native.json" "release/${TAG}/release.json"
          cp "release/${TAG}/release.json" "release/${TAG}/canary.json"

          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "compiler_sha256=${COMPILER_SHA256}" >> "$GITHUB_OUTPUT"
          echo "diagnostics_sha256=${DIAGNOSTICS_SHA256}" >> "$GITHUB_OUTPUT"
          echo "host_decl_sha256=${HOST_DECL_SHA256}" >> "$GITHUB_OUTPUT"

      - name: Upload versioned release to R2
        run: |
          TAG="${{ steps.prepare.outputs.tag }}"
          VERSION="${{ steps.prepare.outputs.version }}"
          # R2 rate-limits high-concurrency PutObject bursts (the ~1000-file
          # conformance tree tripped ServiceUnavailable twice on v0.48.1).
          # Throttle concurrency and let the CLI retry harder.
          aws configure set default.s3.max_concurrent_requests 4
          aws configure set default.retry_mode adaptive
          aws configure set default.max_attempts 10
          # deka-releases has no "v" prefix on its versioned dirs (today:
          # releases.deka.gg/0.53.4/, not /v0.53.4/) -- VERSION here, not TAG.
          aws s3 sync "release/${TAG}/" "s3://${R2_BUCKET_RELEASES}/${VERSION}/" --endpoint-url="${R2_ENDPOINT}" --exclude "canary.json"

      - name: Upload versioned WASM to R2
        run: |
          TAG="${{ steps.prepare.outputs.tag }}"
          # The declaration file lives in the releases bucket only.
          aws s3 sync "release/${TAG}/" "s3://${R2_BUCKET_WASM}/${TAG}/" --endpoint-url="${R2_ENDPOINT}" --exclude "canary.json" --exclude "deka-host.d.ds"

      # rfd#68: canary.json / canary/* instead of latest.json / latest/* --
      # `latest` is stable-only and is never touched by this workflow.
      - name: Publish canary release pointer
        run: |
          TAG="${{ steps.prepare.outputs.tag }}"
          aws s3 cp "release/${TAG}/canary.json" "s3://${R2_BUCKET_RELEASES}/canary.json" --endpoint-url="${R2_ENDPOINT}"

      - name: Publish canary WASM pointers
        run: |
          TAG="${{ steps.prepare.outputs.tag }}"
          aws s3 cp "release/${TAG}/deka-compiler-artifact.json" "s3://${R2_BUCKET_WASM}/canary/deka-compiler-artifact.json" --endpoint-url="${R2_ENDPOINT}"
          aws s3 cp "release/${TAG}/deka-diagnostics-artifact.json" "s3://${R2_BUCKET_WASM}/canary/deka-diagnostics-artifact.json" --endpoint-url="${R2_ENDPOINT}"
          aws s3 cp "release/${TAG}/deka_compiler.wasm" "s3://${R2_BUCKET_WASM}/canary/deka_compiler.wasm" --endpoint-url="${R2_ENDPOINT}"
          aws s3 cp "release/${TAG}/deka_diagnostics.wasm" "s3://${R2_BUCKET_WASM}/canary/deka_diagnostics.wasm" --endpoint-url="${R2_ENDPOINT}"

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${{ steps.prepare.outputs.tag }}"
          TMPDIR="$(mktemp -d)"
          curl -fsSL -o "${TMPDIR}/gh.tar.gz" "https://github.com/cli/cli/releases/download/v2.98.0/gh_2.98.0_linux_amd64.tar.gz"
          tar -xzf "${TMPDIR}/gh.tar.gz" -C "${TMPDIR}"
          GH_BIN="${TMPDIR}/gh_2.98.0_linux_amd64/bin/gh"

          # The release may already exist if the workflow is retried. Make
          # this step idempotent so downstream triggers still run.
          ASSETS=()
          for f in "release/${TAG}"/*; do
            [ -f "$f" ] && ASSETS+=("$f")
          done

          if "$GH_BIN" release view "${TAG}" --repo "${{ github.repository }}" >/dev/null 2>&1; then
            echo "Release ${TAG} already exists. Uploading/overwriting assets."
            "$GH_BIN" release upload "${TAG}" "${ASSETS[@]}" \
              --repo "${{ github.repository }}" --clobber
          else
            "$GH_BIN" release create "${TAG}" \
              --repo "${{ github.repository }}" \
              --title "deka canary ${TAG}" \
              --notes "deka canary build. Not yet promoted -- see rfd#68." \
              --prerelease \
              "${ASSETS[@]}"
          fi

      - name: Summary
        run: |
          TAG="${{ steps.prepare.outputs.tag }}"
          VERSION="${{ steps.prepare.outputs.version }}"
          echo "Published deka canary ${TAG}"
          echo "  release manifest: https://releases.deka.gg/${VERSION}/release.json"
          echo "  canary pointer: https://releases.deka.gg/canary.json"
          echo "  compiler manifest: https://wasm.deka.gg/canary/deka-compiler-artifact.json"
          echo "  diagnostics manifest: https://wasm.deka.gg/canary/deka-diagnostics-artifact.json"
          echo "  downstream notified: create-deka-app (npm canary tag)"
          echo "  to promote: gh workflow run promote.yml -f canary=${TAG}"

      - name: Publish runtime validation evidence
        run: |
          jq -n \
            --arg commit "${{ needs.resolve.outputs.commit }}" \
            --arg tag "${{ needs.resolve.outputs.tag }}" \
            --arg run_url "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}" \
            '{schema: 1, kind: "native-runtime", commit: $commit, tag: $tag, gate: "green", checks: ["frontend-vm-renderer", "packaged-native-app", "browser-wasm-package"], run_url: $run_url}' > validation.json
          aws s3 cp validation.json "s3://${R2_BUCKET_RELEASES}/${{ needs.resolve.outputs.version }}/validation.json" --endpoint-url="${R2_ENDPOINT}"

  # Downstream consumers are notified from a SEPARATE JOB that needs
  # `publish`, not from steps inside it -- a canary's downstream footprint is
  # deliberately narrow (npm canary dist-tag only; website,
  # headless and draftwriter are stable-only, see promote.yml).
  notify:
    name: Notify downstream
    needs: [resolve, publish]
    uses: ./.github/workflows/notify-downstream.yml
    with:
      tag: ${{ needs.resolve.outputs.tag }}
      channel: canary
      create_deka_app: true
    secrets: inherit
