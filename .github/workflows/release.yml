name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

env:
  # sccache talks to R2 through its S3-compatible API.
  # Set CF_ACCOUNT_ID to the numeric account id; the endpoint becomes
  # https://<account-id>.r2.cloudflarestorage.com
  SCCACHE_ENDPOINT: https://${{ secrets.CF_ACCOUNT_ID }}.r2.cloudflarestorage.com
  SCCACHE_REGION: auto
  R2_RELEASES_BUCKET: deka-releases
  R2_WASM_BUCKET: deka-wasm
  R2_RELEASES_ENDPOINT: https://${{ secrets.CF_ACCOUNT_ID }}.r2.cloudflarestorage.com

jobs:
  # ============================================================================
  # Phase 1: Build platform-native CLI binaries
  # ============================================================================
  build-cli-linux-x64:
    name: Build CLI (linux-x64)
    runs-on: ubuntu-latest
    env:
      SCCACHE_BUCKET: deka-sccache-linux-x64
      AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
    steps:
      - uses: actions/checkout@v4

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@1.96.0
        with:
          targets: wasm32-unknown-unknown

      - name: Setup sccache
        uses: mozilla-actions/sccache-action@v0.0.9

      - name: Build deka CLI
        working-directory: runtime
        env:
          RUSTC_WRAPPER: sccache
        run: cargo build --locked --release -p cli

      - name: Show sccache stats
        run: sccache --show-stats

      - name: Stage binary
        run: |
          mkdir -p dist/linux-x64
          cp runtime/target/release/cli dist/linux-x64/deka
          chmod +x dist/linux-x64/deka

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: deka-cli-linux-x64
          path: dist/linux-x64/deka
          if-no-files-found: error

  build-cli-darwin-x64:
    name: Build CLI (darwin-x64)
    runs-on: macos-13
    env:
      SCCACHE_BUCKET: deka-sccache-darwin-x64
      AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
    steps:
      - uses: actions/checkout@v4

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@1.96.0
        with:
          targets: wasm32-unknown-unknown

      - name: Setup sccache
        uses: mozilla-actions/sccache-action@v0.0.9

      - name: Build deka CLI
        working-directory: runtime
        env:
          RUSTC_WRAPPER: sccache
        run: cargo build --locked --release -p cli

      - name: Show sccache stats
        run: sccache --show-stats

      - name: Stage binary
        run: |
          mkdir -p dist/darwin-x64
          cp runtime/target/release/cli dist/darwin-x64/deka
          chmod +x dist/darwin-x64/deka

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: deka-cli-darwin-x64
          path: dist/darwin-x64/deka
          if-no-files-found: error

  build-cli-darwin-arm64:
    name: Build CLI (darwin-arm64)
    runs-on: macos-latest
    env:
      SCCACHE_BUCKET: deka-sccache-darwin-arm64
      AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
    steps:
      - uses: actions/checkout@v4

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@1.96.0
        with:
          targets: wasm32-unknown-unknown

      - name: Setup sccache
        uses: mozilla-actions/sccache-action@v0.0.9

      - name: Build deka CLI
        working-directory: runtime
        env:
          RUSTC_WRAPPER: sccache
        run: cargo build --locked --release -p cli

      - name: Show sccache stats
        run: sccache --show-stats

      - name: Stage binary
        run: |
          mkdir -p dist/darwin-arm64
          cp runtime/target/release/cli dist/darwin-arm64/deka
          chmod +x dist/darwin-arm64/deka

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: deka-cli-darwin-arm64
          path: dist/darwin-arm64/deka
          if-no-files-found: error

  # ============================================================================
  # Phase 2: Build browser compiler WASM artifacts
  # ============================================================================
  build-wasm:
    name: Build browser compiler WASM
    runs-on: ubuntu-latest
    env:
      SCCACHE_BUCKET: deka-sccache-linux-x64
      AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
    steps:
      - uses: actions/checkout@v4

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@1.96.0
        with:
          targets: wasm32-unknown-unknown

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Setup sccache
        uses: mozilla-actions/sccache-action@v0.0.9

      - name: Build WASM artifacts
        env:
          RUSTC_WRAPPER: sccache
          DEKA_SKIP_DIRTY_CHECK: 1
        run: runtime/scripts/build-deka-compiler-wasm.sh runtime/dist/deka-compiler-wasm

      - name: Show sccache stats
        run: sccache --show-stats

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: deka-compiler-wasm
          path: runtime/dist/deka-compiler-wasm/
          if-no-files-found: error

  # ============================================================================
  # Phase 3: Publish all artifacts and manifest to R2
  # ============================================================================
  publish:
    name: Publish to R2
    needs: [build-cli-linux-x64, build-cli-darwin-x64, build-cli-darwin-arm64, build-wasm]
    runs-on: ubuntu-latest
    env:
      AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
      R2_ENDPOINT: https://${{ secrets.CF_ACCOUNT_ID }}.r2.cloudflarestorage.com
    steps:
      - uses: actions/checkout@v4

      - name: Setup AWS CLI for R2
        uses: unfor19/install-aws-cli-action@v1

      - name: Download CLI artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist/artifacts
          pattern: 'deka-cli-*'

      - name: Download WASM artifacts
        uses: actions/download-artifact@v4
        with:
          name: deka-compiler-wasm
          path: dist/artifacts/wasm

      - name: Compute checksums and build manifest
        id: manifest
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          PREFIX="v${VERSION}"
          OUT="dist/${PREFIX}"

          mkdir -p "${OUT}"

          # Normalize artifact layout
          cp "dist/artifacts/deka-cli-linux-x64/deka" "${OUT}/deka-linux-x64"
          cp "dist/artifacts/deka-cli-darwin-x64/deka" "${OUT}/deka-darwin-x64"
          cp "dist/artifacts/deka-cli-darwin-arm64/deka" "${OUT}/deka-darwin-arm64"
          cp dist/artifacts/wasm/deka_compiler.wasm "${OUT}/"
          cp dist/artifacts/wasm/deka_diagnostics.wasm "${OUT}/"

          cd "${OUT}"
          chmod +x deka-linux-x64 deka-darwin-x64 deka-darwin-arm64

          # SHA-256 checksums for every file
          sha256sum * > SHA256SUMS

          # Build manifest
          cat > manifest.json <<EOF
          {
            "version": "${VERSION}",
            "tag": "${GITHUB_REF_NAME}",
            "commit": "${GITHUB_SHA}",
            "published_at": "$(date -u +%Y-%m-%dT%H:%M:%SZ)",
            "binaries": {
              "linux-x64": {
                "name": "deka-linux-x64",
                "sha256": "$(sha256sum deka-linux-x64 | awk '{print $1}')"
              },
              "darwin-x64": {
                "name": "deka-darwin-x64",
                "sha256": "$(sha256sum deka-darwin-x64 | awk '{print $1}')"
              },
              "darwin-arm64": {
                "name": "deka-darwin-arm64",
                "sha256": "$(sha256sum deka-darwin-arm64 | awk '{print $1}')"
              }
            },
            "wasm": {
              "compiler": "deka_compiler.wasm",
              "compiler_sha256": "$(sha256sum deka_compiler.wasm | awk '{print $1}')",
              "diagnostics": "deka_diagnostics.wasm",
              "diagnostics_sha256": "$(sha256sum deka_diagnostics.wasm | awk '{print $1}')"
            }
          }
          EOF

          echo "prefix=${PREFIX}" >> "$GITHUB_OUTPUT"

      - name: Upload release artifacts to R2
        run: |
          PREFIX="${{ steps.manifest.outputs.prefix }}"
          aws s3 sync "dist/${PREFIX}/" "s3://${R2_RELEASES_BUCKET}/${PREFIX}/" --endpoint-url "${R2_ENDPOINT}"

      - name: Update latest manifest
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          PREFIX="v${VERSION}"
          aws s3 cp "dist/${PREFIX}/manifest.json" "s3://${R2_RELEASES_BUCKET}/latest.json" --endpoint-url "${R2_ENDPOINT}"

      - name: Upload WASM artifacts to deka-wasm bucket
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          SRC="dist/v${VERSION}"
          aws s3 cp "${SRC}/deka_compiler.wasm" "s3://${R2_WASM_BUCKET}/v${VERSION}/deka_compiler.wasm" --endpoint-url "${R2_ENDPOINT}"
          aws s3 cp "${SRC}/deka_diagnostics.wasm" "s3://${R2_WASM_BUCKET}/v${VERSION}/deka_diagnostics.wasm" --endpoint-url "${R2_ENDPOINT}"
          aws s3 cp "${SRC}/deka_compiler.wasm.sha256" "s3://${R2_WASM_BUCKET}/v${VERSION}/deka_compiler.wasm.sha256" --endpoint-url "${R2_ENDPOINT}" || true
          aws s3 cp "${SRC}/deka_diagnostics.wasm.sha256" "s3://${R2_WASM_BUCKET}/v${VERSION}/deka_diagnostics.wasm.sha256" --endpoint-url "${R2_ENDPOINT}" || true

      - name: Update deka-wasm latest pointers
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          SRC="dist/v${VERSION}"
          aws s3 cp "${SRC}/deka_compiler.wasm" "s3://${R2_WASM_BUCKET}/latest/deka_compiler.wasm" --endpoint-url "${R2_ENDPOINT}"
          aws s3 cp "${SRC}/deka_diagnostics.wasm" "s3://${R2_WASM_BUCKET}/latest/deka_diagnostics.wasm" --endpoint-url "${R2_ENDPOINT}"
