name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

env:
  SCCACHE_ENDPOINT: "https://08b93c93f8b7adc43678e9afba31e4ee.r2.cloudflarestorage.com"
  SCCACHE_REGION: "auto"
  R2_ENDPOINT: "https://08b93c93f8b7adc43678e9afba31e4ee.r2.cloudflarestorage.com"
  R2_BUCKET_RELEASES: "deka-releases"
  R2_BUCKET_WASM: "deka-wasm"

jobs:
  build-wasm:
    name: Build browser compiler + diagnostics WASM
    runs-on: ubuntu-latest
    env:
      SCCACHE_BUCKET: "deka-sccache-linux-x64"
      AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@1.96.0
        with:
          targets: wasm32-unknown-unknown

      - name: Run sccache-cache
        uses: mozilla-actions/sccache-action@v0.0.9

      - name: Build WASM artifacts
        env:
          RUSTC_WRAPPER: "sccache"
          DEKA_SKIP_DIRTY_CHECK: "1"
        run: runtime/scripts/build-deka-compiler-wasm.sh runtime/dist/deka-compiler-wasm

      - name: Upload WASM artifacts
        uses: actions/upload-artifact@v4
        with:
          name: deka-wasm
          path: runtime/dist/deka-compiler-wasm/*
          retention-days: 1

  build-cli-linux-x64:
    name: Build CLI (linux-x64)
    runs-on: ubuntu-latest
    env:
      SCCACHE_BUCKET: "deka-sccache-linux-x64"
      AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@1.96.0

      - name: Run sccache-cache
        uses: mozilla-actions/sccache-action@v0.0.9

      - name: Build CLI
        env:
          RUSTC_WRAPPER: "sccache"
        run: cd runtime && cargo build --locked --release -p cli

      - name: Prepare binary
        run: |
          mkdir -p dist
          cp runtime/target/release/cli dist/deka-linux-x64
          chmod +x dist/deka-linux-x64

      - name: Upload binary
        uses: actions/upload-artifact@v4
        with:
          name: deka-cli-linux-x64
          path: dist/deka-linux-x64
          retention-days: 1

  build-cli-darwin-x64:
    name: Build CLI (darwin-x64)
    runs-on: macos-13
    env:
      SCCACHE_BUCKET: "deka-sccache-darwin-x64"
      AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@1.96.0

      - name: Run sccache-cache
        uses: mozilla-actions/sccache-action@v0.0.9

      - name: Build CLI
        env:
          RUSTC_WRAPPER: "sccache"
        run: cd runtime && cargo build --locked --release -p cli

      - name: Prepare binary
        run: |
          mkdir -p dist
          cp runtime/target/release/cli dist/deka-darwin-x64
          chmod +x dist/deka-darwin-x64

      - name: Upload binary
        uses: actions/upload-artifact@v4
        with:
          name: deka-cli-darwin-x64
          path: dist/deka-darwin-x64
          retention-days: 1

  build-cli-darwin-arm64:
    name: Build CLI (darwin-arm64)
    runs-on: macos-latest
    env:
      SCCACHE_BUCKET: "deka-sccache-darwin-arm64"
      AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@1.96.0

      - name: Run sccache-cache
        uses: mozilla-actions/sccache-action@v0.0.9

      - name: Build CLI
        env:
          RUSTC_WRAPPER: "sccache"
        run: cd runtime && cargo build --locked --release -p cli

      - name: Prepare binary
        run: |
          mkdir -p dist
          cp runtime/target/release/cli dist/deka-darwin-arm64
          chmod +x dist/deka-darwin-arm64

      - name: Upload binary
        uses: actions/upload-artifact@v4
        with:
          name: deka-cli-darwin-arm64
          path: dist/deka-darwin-arm64
          retention-days: 1

  publish:
    name: Publish to R2
    needs: [build-wasm, build-cli-linux-x64, build-cli-darwin-x64, build-cli-darwin-arm64]
    runs-on: ubuntu-latest
    env:
      AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
      AWS_DEFAULT_REGION: auto
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          pattern: deka-*

      - name: Install AWS CLI
        run: |
          pip install awscli

      - name: Prepare release layout
        id: prepare
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          TAG="${GITHUB_REF_NAME}"
          COMMIT="${GITHUB_SHA}"
          PUBLISHED_AT="$(date -u +%Y-%m-%dT%H:%M:%SZ)"

          mkdir -p "release/${VERSION}" release/wasm-latest

          # CLI binaries
          for platform in linux-x64 darwin-x64 darwin-arm64; do
            src="artifacts/deka-cli-${platform}/deka-${platform}"
            dst="release/${VERSION}/deka-${platform}"
            cp "${src}" "${dst}"
          done

          # WASM artifacts
          cp artifacts/deka-wasm/deka_compiler.wasm "release/${VERSION}/"
          cp artifacts/deka-wasm/deka_diagnostics.wasm "release/${VERSION}/"

          # Compute sha256s and sizes
          sha256() { sha256sum "$1" | awk '{print $1}'; }

          COMPILER_SHA256="$(sha256 "release/${VERSION}/deka_compiler.wasm")"
          COMPILER_SIZE="$(stat -c%s "release/${VERSION}/deka_compiler.wasm")"
          DIAGNOSTICS_SHA256="$(sha256 "release/${VERSION}/deka_diagnostics.wasm")"
          DIAGNOSTICS_SIZE="$(stat -c%s "release/${VERSION}/deka_diagnostics.wasm")"
          CARGO_LOCK_SHA256="$(sha256sum runtime/Cargo.lock | awk '{print $1}')"

          LINUX_X64_SHA256="$(sha256 "release/${VERSION}/deka-linux-x64")"
          DARWIN_X64_SHA256="$(sha256 "release/${VERSION}/deka-darwin-x64")"
          DARWIN_ARM64_SHA256="$(sha256 "release/${VERSION}/deka-darwin-arm64")"

          # Website-compatible compiler manifest
          jq -n \
            --arg version "${VERSION}" \
            --arg commit "${COMMIT}" \
            --arg cargo_lock "${CARGO_LOCK_SHA256}" \
            --arg sha256 "${COMPILER_SHA256}" \
            --argjson bytes "${COMPILER_SIZE}" \
            '{
              schemaVersion: 1,
              compiler: {
                name: "deka-browser-compiler",
                version: $version,
                sourceCommit: $commit,
                abiVersion: 1
              },
              producer: {
                schemaVersion: 1,
                target: "wasm32-unknown-unknown",
                cargoLockSha256: $cargo_lock
              },
              artifact: {
                file: "deka_compiler.wasm",
                sha256: $sha256,
                bytes: $bytes
              }
            }' > "release/${VERSION}/deka-compiler-artifact.json"

          # Website-compatible diagnostics manifest
          jq -n \
            --arg commit "${COMMIT}" \
            --arg cargo_lock "${CARGO_LOCK_SHA256}" \
            --arg sha256 "${DIAGNOSTICS_SHA256}" \
            --argjson bytes "${DIAGNOSTICS_SIZE}" \
            '{
              schemaVersion: 1,
              diagnostics: {
                name: "deka_diagnostics",
                abiVersion: 1,
                sourceCommit: $commit
              },
              producer: {
                schemaVersion: 1,
                target: "wasm32-unknown-unknown",
                cargoLockSha256: $cargo_lock
              },
              artifact: {
                file: "deka_diagnostics.wasm",
                sha256: $sha256,
                bytes: $bytes
              }
            }' > "release/${VERSION}/deka-diagnostics-artifact.json"

          # Release manifest consumed by the website sync job
          jq -n \
            --arg version "${VERSION}" \
            --arg tag "${TAG}" \
            --arg commit "${COMMIT}" \
            --arg published_at "${PUBLISHED_AT}" \
            --arg linux_x64_sha "${LINUX_X64_SHA256}" \
            --arg darwin_x64_sha "${DARWIN_X64_SHA256}" \
            --arg darwin_arm64_sha "${DARWIN_ARM64_SHA256}" \
            --arg compiler_sha "${COMPILER_SHA256}" \
            --arg diagnostics_sha "${DIAGNOSTICS_SHA256}" \
            '{
              version: $version,
              tag: $tag,
              commit: $commit,
              published_at: $published_at,
              binaries: {
                "linux-x64": { name: "deka-linux-x64", sha256: $linux_x64_sha },
                "darwin-x64": { name: "deka-darwin-x64", sha256: $darwin_x64_sha },
                "darwin-arm64": { name: "deka-darwin-arm64", sha256: $darwin_arm64_sha }
              },
              wasm: {
                compiler: "deka_compiler.wasm",
                compiler_sha256: $compiler_sha,
                diagnostics: "deka_diagnostics.wasm",
                diagnostics_sha256: $diagnostics_sha
              }
            }' > "release/${VERSION}/release.json"

          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "compiler_sha256=${COMPILER_SHA256}" >> "$GITHUB_OUTPUT"
          echo "diagnostics_sha256=${DIAGNOSTICS_SHA256}" >> "$GITHUB_OUTPUT"

      - name: Upload versioned release to R2
        run: |
          VERSION="${{ steps.prepare.outputs.version }}"
          aws s3 sync "release/${VERSION}/" "s3://${R2_BUCKET_RELEASES}/${VERSION}/" --endpoint-url="${R2_ENDPOINT}"

      - name: Upload versioned WASM to R2
        run: |
          VERSION="${{ steps.prepare.outputs.version }}"
          aws s3 sync "release/${VERSION}/" "s3://${R2_BUCKET_WASM}/v${VERSION}/" --endpoint-url="${R2_ENDPOINT}"

      - name: Promote latest release manifest
        run: |
          VERSION="${{ steps.prepare.outputs.version }}"
          aws s3 cp "release/${VERSION}/release.json" "s3://${R2_BUCKET_RELEASES}/latest.json" --endpoint-url="${R2_ENDPOINT}"

      - name: Promote latest WASM artifacts
        run: |
          VERSION="${{ steps.prepare.outputs.version }}"
          aws s3 cp "release/${VERSION}/deka-compiler-artifact.json" "s3://${R2_BUCKET_WASM}/latest/deka-compiler-artifact.json" --endpoint-url="${R2_ENDPOINT}"
          aws s3 cp "release/${VERSION}/deka-diagnostics-artifact.json" "s3://${R2_BUCKET_WASM}/latest/deka-diagnostics-artifact.json" --endpoint-url="${R2_ENDPOINT}"
          aws s3 cp "release/${VERSION}/deka_compiler.wasm" "s3://${R2_BUCKET_WASM}/latest/deka_compiler.wasm" --endpoint-url="${R2_ENDPOINT}"
          aws s3 cp "release/${VERSION}/deka_diagnostics.wasm" "s3://${R2_BUCKET_WASM}/latest/deka_diagnostics.wasm" --endpoint-url="${R2_ENDPOINT}"

      - name: Summary
        run: |
          echo "Published deka ${{ github.ref_name }}"
          echo "  release manifest: https://releases.deka.gg/latest.json"
          echo "  compiler manifest: https://wasm.deka.gg/latest/deka-compiler-artifact.json"
          echo "  diagnostics manifest: https://wasm.deka.gg/latest/deka-diagnostics-artifact.json"
