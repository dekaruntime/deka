name: Set R2 CORS

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  set-cors:
    runs-on: ubuntu-latest
    env:
      AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
      AWS_DEFAULT_REGION: auto
      R2_ENDPOINT: https://08b93c93f8b7adc43678e9afba31e4ee.r2.cloudflarestorage.com
    steps:
      - name: Install AWS CLI
        run: |
          python3 -m pip install --break-system-packages awscli
          aws --version

      - name: Apply CORS to deka-wasm bucket
        run: |
          cat > /tmp/cors.json <<'CORS'
          {
            "CORSRules": [
              {
                "AllowedOrigins": ["https://deka.gg", "https://*.deka.gg"],
                "AllowedMethods": ["GET", "HEAD"],
                "AllowedHeaders": ["*"],
                "ExposeHeaders": ["ETag", "Content-Length", "Content-Type"],
                "MaxAgeSeconds": 86400
              }
            ]
          }
          CORS
          aws s3api put-bucket-cors \
            --bucket deka-wasm \
            --cors-configuration file:///tmp/cors.json \
            --endpoint-url="${R2_ENDPOINT}"
          echo "CORS applied to deka-wasm"

      - name: Apply CORS to deka-releases bucket
        run: |
          cat > /tmp/cors.json <<'CORS'
          {
            "CORSRules": [
              {
                "AllowedOrigins": ["https://deka.gg", "https://*.deka.gg"],
                "AllowedMethods": ["GET", "HEAD"],
                "AllowedHeaders": ["*"],
                "ExposeHeaders": ["ETag", "Content-Length", "Content-Type"],
                "MaxAgeSeconds": 86400
              }
            ]
          }
          CORS
          aws s3api put-bucket-cors \
            --bucket deka-releases \
            --cors-configuration file:///tmp/cors.json \
            --endpoint-url="${R2_ENDPOINT}"
          echo "CORS applied to deka-releases"
