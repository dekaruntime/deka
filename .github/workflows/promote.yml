# rfd#68: promotion is the only way a plain vX.Y.Z tag is ever created. There
# is no tag-push trigger here on purpose -- the stable tag is WRITTEN by this
# workflow at the end, at the canary's own commit, so the tag always means
# "this was promoted", never "someone pushed a tag by hand". No Rust
# toolchain runs here: promotion copies bytes a canary already built and
# tested, it does not rebuild them.
name: Promote

on:
  workflow_dispatch:
    inputs:
      canary:
        description: "Canary tag to promote, e.g. v0.59.0-canary-d5661ed"
        required: true
        type: string

permissions:
  contents: write

env:
  R2_BUCKET_RELEASES: "deka-releases"
  R2_BUCKET_WASM: "deka-wasm"

jobs:
  promote:
    name: Promote canary to stable
    runs-on: ubuntu-latest
    environment: release
    env:
      R2_ENDPOINT: ${{ secrets.R2_ENDPOINT }}
      AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
      AWS_DEFAULT_REGION: auto
    outputs:
      tag: ${{ steps.validate.outputs.tag }}
      version: ${{ steps.validate.outputs.version }}
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          # Full history + tags: gate (a) walks existing v* tags.
          fetch-depth: 0

      - name: Where am I
        uses: ./.github/actions/where-am-i

      # Gate (a): the input names a real canary tag, and no stable tag for
      # that base version exists yet.
      - name: "Gate a: canary tag is well-formed, exists, and is unpromoted"
        id: validate
        run: |
          set -euo pipefail
          CANARY="${{ inputs.canary }}"

          if [[ ! "$CANARY" =~ ^v([0-9]+\.[0-9]+\.[0-9]+)-canary-[0-9a-f]{7}$ ]]; then
            echo "::error::'${CANARY}' is not a canary tag. Expected vX.Y.Z-canary-<7-hex-sha>, e.g. v0.59.0-canary-d5661ed."
            exit 1
          fi
          V="${BASH_REMATCH[1]}"

          git fetch origin --tags --force
          if ! git rev-parse "refs/tags/${CANARY}" >/dev/null 2>&1; then
            echo "::error::canary tag ${CANARY} does not exist in dekaruntime/deka."
            exit 1
          fi
          if git rev-parse "refs/tags/v${V}" >/dev/null 2>&1; then
            echo "::error::v${V} is already tagged -- a stable version can only be promoted once. If this line needs to ship again, cut a new canary (bump-version.sh) rather than re-promoting."
            exit 1
          fi

          CANARY_COMMIT="$(git rev-parse "${CANARY}^{commit}")"

          echo "canary=${CANARY}" >> "$GITHUB_OUTPUT"
          # deka-releases has no "v" prefix on its versioned dirs (today:
          # releases.deka.gg/0.53.4/, not /v0.53.4/) -- canary_version is the
          # releases.deka.gg path segment for this canary; deka-wasm keeps
          # its "v"-prefixed convention, so wasm paths use $CANARY (the git
          # tag, already "v"-prefixed) directly.
          echo "canary_version=${CANARY#v}" >> "$GITHUB_OUTPUT"
          echo "tag=v${V}" >> "$GITHUB_OUTPUT"
          echo "version=${V}" >> "$GITHUB_OUTPUT"
          echo "commit=${CANARY_COMMIT}" >> "$GITHUB_OUTPUT"

      - name: Install AWS CLI
        run: command -v aws >/dev/null 2>&1 || pip install --break-system-packages awscli

      # Gate (b): the canary actually shipped, and R2's record of it names
      # the same commit the tag does. deka's release manifest file is named
      # release.json (there is no separately-named manifest.json in this
      # repo's R2 layout); this is that file.
      - name: "Gate b: canary shipped and its manifest matches the tag's commit"
        id: manifest
        run: |
          set -euo pipefail
          CANARY="${{ steps.validate.outputs.canary }}"
          CANARY_VERSION="${{ steps.validate.outputs.canary_version }}"
          COMMIT="${{ steps.validate.outputs.commit }}"

          if ! curl -fsSL "https://releases.deka.gg/${CANARY_VERSION}/release.json" -o release.json; then
            echo "::error::${CANARY_VERSION}/release.json was not found on releases.deka.gg. The canary build may not have finished publishing -- check its release.yml run before retrying."
            exit 1
          fi

          MANIFEST_COMMIT="$(jq -r '.commit' release.json)"
          if [[ "$MANIFEST_COMMIT" != "$COMMIT" ]]; then
            echo "::error::${CANARY}/release.json records commit ${MANIFEST_COMMIT}, but git tag ${CANARY} points at ${COMMIT}. Refusing to promote a mismatched build."
            exit 1
          fi

          DSC_VERSION="$(jq -r '.dsc_version' release.json)"
          echo "dsc_version=${DSC_VERSION}" >> "$GITHUB_OUTPUT"

      # Gate (c): a testsuite run against THIS canary's own commit says
      # green. A green result from a different (even newer) canary of the
      # same base version cannot be reused -- validation.json is checked
      # against the same commit as gate (b).
      - name: "Gate c: integration is green for this exact commit"
        run: |
          set -euo pipefail
          CANARY="${{ steps.validate.outputs.canary }}"
          CANARY_VERSION="${{ steps.validate.outputs.canary_version }}"
          COMMIT="${{ steps.validate.outputs.commit }}"

          if ! curl -fsSL "https://releases.deka.gg/${CANARY_VERSION}/validation.json" -o validation.json; then
            echo "::error::${CANARY} has not been validated yet (no validation.json on releases.deka.gg). Wait for its dump-conformance job to finish, or re-run it, before promoting."
            exit 1
          fi

          VALIDATION_COMMIT="$(jq -r '.commit' validation.json)"
          if [[ "$VALIDATION_COMMIT" != "$COMMIT" ]]; then
            echo "::error::validation.json for ${CANARY} records commit ${VALIDATION_COMMIT}, not ${COMMIT}. A green result from a different canary cannot be reused."
            exit 1
          fi

          GATE="$(jq -r '.gate' validation.json)"
          if [[ "$GATE" != "green" ]]; then
            echo "::error::${CANARY}'s conformance gate is '${GATE}', not green. Fix and cut a new canary before promoting."
            exit 1
          fi

      # Gate (d): a stable deka may not pin a prerelease dsc.
      - name: "Gate d: stable pins stable (dsc has no prerelease suffix)"
        run: |
          set -euo pipefail
          DSC_VERSION="${{ steps.manifest.outputs.dsc_version }}"
          if [[ "$DSC_VERSION" == *-* ]]; then
            echo "::error::this canary pins dsc ${DSC_VERSION}, which is a prerelease. A stable deka must pin a stable dsc."
            exit 1
          fi

      - name: Copy canary artifacts to the stable path
        run: |
          set -euo pipefail
          CANARY="${{ steps.validate.outputs.canary }}"
          CANARY_VERSION="${{ steps.validate.outputs.canary_version }}"
          TAG="${{ steps.validate.outputs.tag }}"
          VERSION="${{ steps.validate.outputs.version }}"
          aws configure set default.s3.max_concurrent_requests 4
          aws configure set default.retry_mode adaptive
          aws configure set default.max_attempts 10
          # deka-releases: no "v" prefix (releases.deka.gg/0.53.4/, not
          # /v0.53.4/). deka-wasm: keeps its existing "v"-prefixed dirs.
          aws s3 cp --recursive "s3://${R2_BUCKET_RELEASES}/${CANARY_VERSION}/" "s3://${R2_BUCKET_RELEASES}/${VERSION}/" --endpoint-url="${R2_ENDPOINT}"
          aws s3 cp --recursive "s3://${R2_BUCKET_WASM}/${CANARY}/" "s3://${R2_BUCKET_WASM}/${TAG}/" --endpoint-url="${R2_ENDPOINT}"

      # Same manifest keys, bytes and checksums as the canary -- only
      # version/tag/channel/promoted_from change. This is a republish of the
      # canary's own bytes, never a rebuild.
      - name: Rewrite the stable manifest and promote latest.json
        run: |
          set -euo pipefail
          VERSION="${{ steps.validate.outputs.version }}"
          TAG="${{ steps.validate.outputs.tag }}"
          CANARY="${{ steps.validate.outputs.canary }}"

          jq \
            --arg version "$VERSION" \
            --arg tag "$TAG" \
            --arg channel "stable" \
            --arg promoted_from "$CANARY" \
            '.version = $version | .tag = $tag | .channel = $channel | .promoted_from = $promoted_from' \
            release.json > release.stable.json

          aws s3 cp release.stable.json "s3://${R2_BUCKET_RELEASES}/${VERSION}/release.json" --endpoint-url="${R2_ENDPOINT}"
          aws s3 cp release.stable.json "s3://${R2_BUCKET_RELEASES}/latest.json" --endpoint-url="${R2_ENDPOINT}"

      - name: Promote wasm latest pointers
        run: |
          set -euo pipefail
          TAG="${{ steps.validate.outputs.tag }}"
          for f in deka-compiler-artifact.json deka-diagnostics-artifact.json deka_compiler.wasm deka_diagnostics.wasm; do
            aws s3 cp "s3://${R2_BUCKET_WASM}/${TAG}/${f}" "s3://${R2_BUCKET_WASM}/latest/${f}" --endpoint-url="${R2_ENDPOINT}"
          done
          aws s3 sync "s3://${R2_BUCKET_WASM}/${TAG}/conformance/" "s3://${R2_BUCKET_WASM}/latest/conformance/" --endpoint-url="${R2_ENDPOINT}"

      # The stable tag itself is the record of promotion -- created here,
      # never pushed by a human, always at the canary's own commit.
      - name: Create and push the stable tag
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          TAG="${{ steps.validate.outputs.tag }}"
          CANARY="${{ steps.validate.outputs.canary }}"
          COMMIT="${{ steps.validate.outputs.commit }}"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "$TAG" -m "deka $TAG (promoted from $CANARY)" "$COMMIT"
          git push origin "$TAG"

      - name: Summary
        run: |
          TAG="${{ steps.validate.outputs.tag }}"
          CANARY="${{ steps.validate.outputs.canary }}"
          echo "Promoted ${CANARY} to ${TAG}"
          echo "  release manifest: https://releases.deka.gg/latest.json"
          echo "  compiler manifest: https://wasm.deka.gg/latest/deka-compiler-artifact.json"
          echo "  downstream notified: website, create-deka-app (npm latest), testsuite-site, draftwriter, headless"

  notify:
    name: Notify downstream
    needs: [promote]
    uses: ./.github/workflows/notify-downstream.yml
    with:
      tag: ${{ needs.promote.outputs.tag }}
      channel: stable
      website: true
      create_deka_app: true
      testsuite_site: true
      draftwriter: true
      headless: true
    secrets: inherit
