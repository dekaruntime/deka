# rfd#68: every merge to main is a canary. This workflow is the only thing
# that creates a canary tag — no human pushes `-canary-` tags by hand. The
# newest canary always answers "which build should I test", and promoting a
# canary to stable (a separate manual step — see promote.yml) is the only
# thing that ever moves the stable channel.
name: Tag canary

on:
  push:
    branches:
      - main

permissions:
  contents: write
  actions: write

jobs:
  tag:
    name: Tag + start canary build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          # Need full history + tags: the checks below walk existing v* tags.
          fetch-depth: 0

      - name: Where am I
        uses: ./.github/actions/where-am-i

      - name: Tag this commit as a canary and start its build
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail

          V="$(scripts/runtime-version.sh)"

          # A stable tag for the current tree version already exists: someone
          # already promoted a canary of this exact version (or tagged it by
          # hand) before the next bump landed. Building another canary of an
          # already-shipped version has nothing new to promote.
          if git rev-parse "refs/tags/v${V}" >/dev/null 2>&1; then
            echo "::warning::v${V} is already promoted; bump the version before the next canary."
            exit 0
          fi

          SHA7="$(git rev-parse --short=7 HEAD)"
          TAG="v${V}-canary-${SHA7}"

          # A canary tag for this exact commit already exists — a retried
          # push event, or this workflow ran twice for the same HEAD. Nothing
          # new to build.
          if git rev-parse "refs/tags/${TAG}" >/dev/null 2>&1; then
            echo "canary tag ${TAG} already exists; not re-tagging."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "$TAG" -m "deka canary $TAG"

          # Pushed with GITHUB_TOKEN (the credential actions/checkout already
          # wired into this workspace). GitHub's loop prevention means a push
          # made by GITHUB_TOKEN does NOT fire any workflow's `on: push`
          # trigger in this repo — so release.yml's own
          # `push: tags: v*-canary-*` trigger deliberately does not fire from
          # this line. That trigger exists for the case of a human pushing a
          # canary tag by hand, which is a normal (non-bot) push and fires it
          # as usual.
          git push origin "$TAG"

          # workflow_dispatch is the one documented exception to GITHUB_TOKEN
          # loop prevention: this call DOES start release.yml even though the
          # tag push immediately above did not.
          gh workflow run release.yml --repo "${{ github.repository }}" --ref "$TAG"

          echo "started release.yml for ${TAG}"
