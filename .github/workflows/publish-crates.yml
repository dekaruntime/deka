name: Publish deka-ui crates

# Publishes the deka-ui family to crates.io, in dependency order (cargo orders them):
#   deka-vello-gpu-shaders, deka-vello-gpu, deka-rfd  (deka's forks, imported under upstream names)
#   deka-ui-core, deka-ui-native, deka-ui-macros       (internal parts of deka-ui)
#   deka-ui                                            (the library users install)
# Plan: dekaruntime/staff decisions/2026-10-deka-ui-crates-and-first-release.md
#
# Manual only. Defaults to a dry run, which packages every crate and builds each package in
# isolation (no paths, no patches) without uploading anything.
#
# Credentials, in the `release` environment:
# - First release: CARGO_REGISTRY_TOKEN, a crates.io token scoped to publish-new and
#   publish-update for `deka*`. Sami adds it; agents never handle it.
# - After that: crates.io trusted publishing (this workflow and the `release` environment are
#   registered on each crate). The token secret is then deleted, and the OIDC step below
#   supplies a short-lived token instead.
on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: Package and verify only; upload nothing
        type: boolean
        default: true

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: release
    permissions:
      contents: read
      id-token: write # crates.io trusted publishing
    env:
      RUSTC_WRAPPER: sccache
      SCCACHE_GHA_ENABLED: "true"
      CARGO_INCREMENTAL: 0
      # Secrets can't appear in `if:`; expose only whether the one-time token exists.
      HAS_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN != '' }}
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@1.96.0
      - uses: mozilla-actions/sccache-action@v0.0.9
      - name: Dry run (package and verify all seven crates)
        if: ${{ inputs.dry_run }}
        run: >-
          cargo publish --dry-run --locked
          -p deka-vello-gpu-shaders -p deka-vello-gpu -p deka-rfd
          -p deka-ui-core -p deka-ui-native -p deka-ui-macros -p deka-ui
      # Trusted publishing: exchange this job's OIDC identity for a short-lived crates.io
      # token. Skipped while the one-time CARGO_REGISTRY_TOKEN secret exists.
      - name: crates.io trusted publishing
        id: auth
        if: ${{ !inputs.dry_run && env.HAS_TOKEN != 'true' }}
        uses: rust-lang/crates-io-auth-action@v1
      - name: Publish
        if: ${{ !inputs.dry_run }}
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN || steps.auth.outputs.token }}
        run: >-
          cargo publish --locked
          -p deka-vello-gpu-shaders -p deka-vello-gpu -p deka-rfd
          -p deka-ui-core -p deka-ui-native -p deka-ui-macros -p deka-ui
