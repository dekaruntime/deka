name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  utility-css:
    name: Utility CSS generator
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Regenerate bundle
        working-directory: runtime/assets/utility-css
        run: bun build.ts

      - name: Check for uncommitted changes
        run: |
          if [ -n "$(git status --porcelain runtime/assets/utility-css/bundle.js)" ]; then
            echo "::error::runtime/assets/utility-css/bundle.js is out of date. Run 'bun build.ts' in that directory and commit the result."
            git diff runtime/assets/utility-css/bundle.js
            exit 1
          fi

      - name: Run utility-css smoke tests
        working-directory: runtime/assets/utility-css
        run: bun test.ts

  # Rust tests are temporarily disabled in CI because the workspace depends on a
  # private cargo registry (sparse+https://git.tana.gg/index/) for
  # harar-client. Once that dependency is publicly resolvable or vendored, add
  # the cargo build/test steps back here.
  # rust:
  #   name: Rust tests
  ###############################################################################
