name: CI

on:
  # PRs always run: main has branch protection requiring these checks, and a
  # paths-ignore here would leave docs-only PRs permanently unmergeable. The
  # tag-triggered Release workflow validates the merged production artifact.
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    name: Detect changed files
    runs-on: ubuntu-latest
    outputs:
      rust: ${{ steps.detect.outputs.rust }}
      lockfile: ${{ steps.detect.outputs.lockfile }}
      bun_lockfile: ${{ steps.detect.outputs.bun_lockfile }}
      utility_css: ${{ steps.detect.outputs.utility_css }}
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Detect change categories
        id: detect
        run: |
          git fetch origin main --quiet
          files="$(git diff --name-only origin/main...HEAD | sort -u)"

          echo "Changed files:"
          echo "$files"

          rust=false
          lockfile=false
          bun_lockfile=false
          utility_css=false

          # Cargo.toml / Cargo.lock changes MUST run the Rust suite: a
          # dependency bump compiles different code, and dependabot PRs were
          # passing as CLEAN with typecheck+tests skipped (deka#860).
          if echo "$files" | grep -qE '^(crates/.+\.rs|crates/.+\.js|crates/.+\.ts|crates/.+/build\.rs|assets/.+|scripts/.+|tests/.+|Cargo\.(toml|lock)|crates/.+/Cargo\.toml|\.github/workflows/(ci|release)\.yml)$'; then
            rust=true
          fi

          if echo "$files" | grep -qE '^(crates/.+/Cargo\.toml|Cargo\.lock)$'; then
            lockfile=true
          fi

          # deka#1006: tests/dump/bun.lock was committed at lockfileVersion 2,
          # which the pinned Bun (1.3.14) cannot read. Nothing enforced that
          # this lockfile stays installable on a PR — the only PR-time signal
          # was a non-frozen `bun install` inside the full Rust suite, and
          # non-frozen install silently reinstalls over a lockfile it cannot
          # parse instead of failing. Route both bun.lock and its package.json
          # through the same "lockfile consistency" job Cargo.lock uses, so
          # one job means "all lockfiles in this repo are honored", not two
          # narrower ones.
          if echo "$files" | grep -qE '^tests/dump/(package\.json|bun\.lock)$'; then
            bun_lockfile=true
          fi

          if echo "$files" | grep -qE '^assets/utility-css/.+$'; then
            utility_css=true
          fi

          echo "rust=$rust" >> "$GITHUB_OUTPUT"
          echo "lockfile=$lockfile" >> "$GITHUB_OUTPUT"
          echo "bun_lockfile=$bun_lockfile" >> "$GITHUB_OUTPUT"
          echo "utility_css=$utility_css" >> "$GITHUB_OUTPUT"

  utility-css:
    name: Utility CSS generator
    needs: [changes]
    if: needs.changes.outputs.utility_css == 'true'
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v5

      - name: Setup Bun
        uses: ./.github/actions/setup-bun

      - name: Regenerate bundle
        working-directory: assets/utility-css
        run: bun build.ts

      - name: Check for uncommitted changes
        run: |
          if [ -n "$(git status --porcelain assets/utility-css/bundle.js)" ]; then
            echo "::error::assets/utility-css/bundle.js is out of date. Run 'bun build.ts' in that directory and commit the result."
            git diff assets/utility-css/bundle.js
            exit 1
          fi

      - name: Run utility-css smoke tests
        working-directory: assets/utility-css
        run: bun test.ts

  lockfile-check:
    name: Lockfile consistency
    needs: [changes]
    # deka#1029 audit: there is deliberately no Cargo-specific step in this
    # job. Every file pattern that sets `lockfile=true` (`Cargo.lock`,
    # `crates/*/Cargo.toml`) is a strict subset of the `rust` regex, so
    # `lockfile == 'true'` implies `rust == 'true'` unconditionally — a step
    # gated on `lockfile == 'true' && rust != 'true'` can never run (this was
    # deka#1028's original bug, and reappeared here in step form when #1026
    # fixed only the job-level condition and left the step commented as
    # future work). Cargo's `--locked` guarantee is fully covered instead by
    # rust-check's `cargo check --locked --workspace --all-targets`, which
    # runs on every PR where `lockfile == 'true'` because that implication is
    # exactly why the dead step's guard could never fire. Deleted rather than
    # patched: a working substitute already exists, so a repaired condition
    # here would just be a second copy of rust-check's check.
    # bun.lock has no such stand-in elsewhere, so its step runs independently
    # of the rust flag — see the bun_lockfile branch below.
    if: needs.changes.outputs.lockfile == 'true' || needs.changes.outputs.bun_lockfile == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      # deka#1006: `bun install` (no flag) treats an unreadable lockfile as a
      # warning, not a failure — it prints "Ignoring lockfile" and silently
      # re-resolves from the registry. That is how tests/dump/bun.lock sat on
      # main for a day at lockfileVersion 2 (unreadable by the pinned bun
      # 1.3.14) without a single red PR check. --frozen-lockfile is the
      # opposite: it refuses to proceed unless the lockfile is present and
      # exactly satisfies package.json, which is the actual property release
      # depends on. This step alone is the whole fix, wired to run before any
      # tag is cut instead of only during one.
      - name: Setup Bun
        if: needs.changes.outputs.bun_lockfile == 'true'
        uses: ./.github/actions/setup-bun

      - name: Verify tests/dump/bun.lock is installable frozen
        if: needs.changes.outputs.bun_lockfile == 'true'
        working-directory: tests/dump
        run: bun install --frozen-lockfile

  rust-check:
    name: Rust typecheck
    needs: [changes]
    if: needs.changes.outputs.rust == 'true'
    runs-on: ubuntu-latest
    environment: public-ci
    env:
      CARGO_INCREMENTAL: 0
      CARGO_PROFILE_DEV_DEBUG: 0
      CARGO_PROFILE_TEST_DEBUG: 0
      SCCACHE_ENDPOINT: ${{ secrets.R2_ENDPOINT }}
      SCCACHE_REGION: "auto"
      AWS_ACCESS_KEY_ID: ${{ secrets.R2_SCCACHE_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SCCACHE_SECRET_ACCESS_KEY }}
    steps:
      - uses: actions/checkout@v5

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@1.96.0
        with:
          # rust-toolchain.toml pins 1.96.0 for every cargo invocation in this
          # directory, overriding the rustup default — so clippy must be added
          # to the pinned toolchain, not to a separately installed stable.
          components: clippy

      - name: Configure sccache bucket
        run: |
          if [ -z "$AWS_ACCESS_KEY_ID" ] || [ -z "$AWS_SECRET_ACCESS_KEY" ] || [ -z "$SCCACHE_ENDPOINT" ]; then
            echo "::notice::R2 cache is not configured for this run; building without sccache."
            exit 0
          fi
          # Keep the Linux check cache separate from Darwin artifacts. These
          # names match scripts/populate-sccache.sh and deka#655.
          echo "SCCACHE_BUCKET=deka-sccache-linux-x64" >> "$GITHUB_ENV"
          echo "sccache bucket: deka-sccache-linux-x64"

      - name: Run sccache-cache
        if: ${{ env.AWS_ACCESS_KEY_ID != '' && env.AWS_SECRET_ACCESS_KEY != '' && env.SCCACHE_ENDPOINT != '' }}
        uses: mozilla-actions/sccache-action@v0.0.9

      - name: Enable sccache compiler wrapper
        run: |
          if [ -z "$AWS_ACCESS_KEY_ID" ] || [ -z "$AWS_SECRET_ACCESS_KEY" ] || [ -z "$SCCACHE_ENDPOINT" ]; then
            exit 0
          fi
          if command -v sccache >/dev/null 2>&1; then
            echo "RUSTC_WRAPPER=sccache" >> "$GITHUB_ENV"
            echo "sccache enabled, bucket: $SCCACHE_BUCKET"
          else
            echo "::warning::sccache not found on PATH - building without a compiler cache."
          fi

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true

      - name: Check workspace
        run: cargo check --locked --workspace --all-targets

      # Folded in from the standalone rust-clippy analyze workflow: same flags
      # (--all-features), same pinned 1.96.0 toolchain as the check above (the
      # clippy component is installed by the job's Setup Rust step).
      - name: Run clippy
        run: cargo clippy --all-features

      # macOS runs this through the workspace suite below. Ubuntu must also
      # execute the produced native binary, rather than only typechecking it.
      - name: Install dsc for executable smoke test
        run: scripts/ci-install-dsc.sh "${{ github.workspace }}/.ci/dsc"

      - name: Smoke test host-target executable compilation
        env:
          DEKA_DSC: ${{ github.workspace }}/.ci/dsc
          NO_COLOR: "1"
          FORCE_COLOR: "0"
        run: cargo test --locked --release -p cli --test compile_executable

      - name: Report sccache usage
        if: ${{ always() && env.AWS_ACCESS_KEY_ID != '' && env.AWS_SECRET_ACCESS_KEY != '' && env.SCCACHE_ENDPOINT != '' }}
        run: |
          if command -v sccache >/dev/null 2>&1; then
            sccache --show-stats
          fi

  file-size-gate:
    name: File-size gate
    needs: [changes]
    if: needs.changes.outputs.rust == 'true'
    runs-on: ubuntu-latest
    steps:
      # On pull_request this checkout is the merge result — the only tree
      # where a file grown a few hundred lines at a time across a stacked PR
      # series is visible (deka#391).
      - uses: actions/checkout@v5

      - name: Check crates/**.rs file sizes
        run: scripts/check-file-size.sh

      - name: Check cli composition surface (rfd#61)
        run: scripts/check-cli-surface.sh

  rust:
    name: Rust tests
    needs: [changes, rust-check]
    if: needs.changes.outputs.rust == 'true'
    runs-on: macos-14
    environment: public-ci
    env:
      CARGO_INCREMENTAL: 0
      CARGO_PROFILE_DEV_DEBUG: 0
      CARGO_PROFILE_TEST_DEBUG: 0
      SCCACHE_ENDPOINT: ${{ secrets.R2_ENDPOINT }}
      SCCACHE_REGION: "auto"
      AWS_ACCESS_KEY_ID: ${{ secrets.R2_SCCACHE_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SCCACHE_SECRET_ACCESS_KEY }}
    steps:
      - uses: actions/checkout@v5

      - name: Forbid vendored testsuite corpus
        run: |
          if find tests -type d -name testsuite -print -quit | grep -q .; then
            echo "::error::testsuite corpus must not be vendored; it is owned by dekaruntime/testsuite. Use 'deka self fetch testsuite'"
            exit 1
          fi

      - name: Forbid vendored tour
        run: |
          if find tests -type d -name tour -print -quit | grep -q .; then
            echo "::error::tour must not be vendored; it is owned by dekaruntime/tour. Use 'deka self fetch tour'"
            exit 1
          fi

      - name: Where am I?
        run: |
          echo "runner name: $(hostname)"
          echo "runner os: ${{ runner.os }}"
          echo "runner arch: ${{ runner.arch }}"
          echo "uname -a: $(uname -a)"
          (which cargo && cargo --version) || true
          (which bun && bun --version) || true

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@1.96.0

      - name: Setup Bun for browser WASM parity
        uses: ./.github/actions/setup-bun

      - name: Configure sccache bucket
        run: |
          if [ -z "$AWS_ACCESS_KEY_ID" ] || [ -z "$AWS_SECRET_ACCESS_KEY" ] || [ -z "$SCCACHE_ENDPOINT" ]; then
            echo "::notice::R2 cache is not configured for this run; building without sccache."
            exit 0
          fi
          # Bucket is architecture-specific; derive it from the host rather than
          # restating it per job (see scripts/populate-sccache.sh, deka#655).
          case "$(uname -s)-$(uname -m)" in
            Darwin-arm64)  BUCKET=deka-sccache-darwin-arm64 ;;
            Darwin-x86_64) BUCKET=deka-sccache-darwin-x64 ;;
            Linux-x86_64)  BUCKET=deka-sccache-linux-x64 ;;
            *) echo "unsupported sccache host: $(uname -sm)" >&2; exit 1 ;;
          esac
          echo "SCCACHE_BUCKET=$BUCKET" >> "$GITHUB_ENV"
          echo "sccache bucket: $BUCKET"

      # The action installs the binary. It receives the R2 bucket selected
      # above, rather than an incomplete cache configuration.
      - name: Run sccache-cache
        if: ${{ env.AWS_ACCESS_KEY_ID != '' && env.AWS_SECRET_ACCESS_KEY != '' && env.SCCACHE_ENDPOINT != '' }}
        uses: mozilla-actions/sccache-action@v0.0.9

      - name: Enable sccache compiler wrapper
        run: |
          if [ -z "$AWS_ACCESS_KEY_ID" ] || [ -z "$AWS_SECRET_ACCESS_KEY" ] || [ -z "$SCCACHE_ENDPOINT" ]; then
            exit 0
          fi
          # The rust-toolchain action reinstalls rustup, which wipes
          # cargo-installed binaries out of ~/.cargo/bin - sccache included.
          # Setting RUSTC_WRAPPER to a binary that is not there makes every
          # cargo invocation die with ENOENT before it compiles anything, which
          # reads as a code failure and is not one. Only enable the wrapper if
          # the binary actually exists; a cold build is worse than a cached one
          # and far better than a false red.
          if command -v sccache >/dev/null 2>&1; then
            echo "RUSTC_WRAPPER=sccache" >> "$GITHUB_ENV"
            echo "sccache enabled, bucket: $SCCACHE_BUCKET"
          else
            echo "::warning::sccache not found on PATH - building without a compiler cache. Reinstall it on this runner (cargo install sccache --locked); see deka#656."
          fi

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2
        with:
          cache-directories: |
            target/**/gn_out
          cache-on-failure: true

      # Build the release CLI before the workspace test so pm's
      # real_cli_invocation_recovers_each_atomic_swap_boundary test can find
      # target/release/cli (deka#521).
      #
      # check-prod-react-bytes.sh (deka#982) already builds the
      # default-feature release CLI as part of its byte scan, and leaves it
      # at target/release/cli — the exact artifact this step's own
      # `cargo build --release -p cli` produces. That makes this line a
      # cargo cache hit in the common case; it stays explicit rather than
      # relying on script-internal ordering, since the next step depends on
      # this exact path existing regardless of how the scan script evolves.
      - name: Build CLI for runtime execution tests
        run: |
          scripts/check-prod-react-bytes.sh
          cargo build --release -p cli

      # RFD 59 (deka#836): the shipped CLI fetches the pinned content
      # checkouts. This replaces scripts/ci-fetch-testsuite-corpus.sh and
      # scripts/ci-fetch-tour.sh, and is the zero-environment-variable path.
      - name: Fetch pinned content (self fetch)
        run: |
          ./target/release/cli self fetch testsuite
          ./target/release/cli self fetch tour

      # rfd#38: language compile is dsc. Fetch the published CLI + browser
      # wasm; do not rebuild deka_compiler_wasm from this tree.
      - name: Install published dsc
        run: |
          scripts/ci-install-dsc.sh "${{ github.workspace }}/.ci/dsc" \
            --wasm "${{ github.workspace }}/.ci/wasm"
          "${{ github.workspace }}/.ci/dsc" --version

      # Run every workspace crate's tests, not a hand-maintained list. 15
      # compiler/runtime crates containing ~540 tests were not executed by the
      # previous per-crate steps (deka#521). --workspace makes the default
      # opt-out with a required justification; opt-in lists silently drop
      # crates.
      #
      # Runs every target in parallel. --test-threads=1 was masking deka#427,
      # where a process-global test hook fired inside unrelated tests; parallel
      # execution is what makes CI able to catch that class again. The cli
      # crate in particular needs every target, not just --lib: six integration
      # tests under crates/cli/tests/ were red on main, including two that
      # caught deka#437 (a shipped Worker whose handlers were referenced but
      # never defined). deka-fmt's corpus round-trip property test (deka#477)
      # also only runs if the crate is tested here.
      # rfd#38: language compile is dsc. The CLI execs check/fmt/transpile/lsp
      # when DEKA_DSC is set; without it those tests silently use the
      # in-process crates we are deleting. Isolate/run.sh/dump already pass
      # this. Do not place dsc next to target/release/cli — dump pairing
      # keys off that sibling.
      - name: Test workspace
        env:
          DEKA_DSC: ${{ github.workspace }}/.ci/dsc
        run: cargo test --locked --workspace --features cli/dev-server

      - name: Exec dsc for check, fmt, transpile
        env:
          DEKA_DSC: ${{ github.workspace }}/.ci/dsc
        run: |
          tmp=$(mktemp -d)
          printf 'export const answer = 42\n' > "$tmp/ok.ds"
          "${{ github.workspace }}/target/release/cli" check "$tmp/ok.ds"
          "${{ github.workspace }}/target/release/cli" fmt "$tmp/ok.ds"
          "${{ github.workspace }}/target/release/cli" transpile "$tmp/ok.ds"
          test -f "$tmp/ok.js"
          rm -rf "$tmp"

      - name: Run tour + public conformance suite (native)
        env:
          DEKA_DSC: ${{ github.workspace }}/.ci/dsc
          DEKA_WASM: ${{ github.workspace }}/.ci/wasm/deka_compiler.wasm
        run: ./run.sh --skip-build --locked

      - name: Install dump harness deps + Chromium
        working-directory: tests/dump
        # --frozen-lockfile: deka#1006. Plain `bun install` treats a lockfile
        # it can't read as a warning and silently re-resolves instead of
        # failing, which is exactly how this job kept going green.
        run: |
          bun install --frozen-lockfile
          bunx playwright install chromium

      # The full dump only runs on release; without this smoke, harness
      # breakage (bad shim paths, import-transform regressions) ships red.
      - name: Dump harness smoke (browser + native)
        env:
          DEKA_DSC: ${{ github.workspace }}/.ci/dsc
          DEKA_NATIVE: ${{ github.workspace }}/target/release/cli
          DEKA_WASM: ${{ github.workspace }}/.ci/wasm/deka_compiler.wasm
        run: bun tests/dump/scripts/smoke.mjs

      # A fresh HTTP request can observe an edit even when the injected HMR
      # client fails to parse. Keep a real browser page loaded and require the
      # source edit to update that page (deka#779).
      - name: Browser HMR source-edit regression
        env:
          DEKA_DSC: ${{ github.workspace }}/.ci/dsc
          DEKA_NATIVE: ${{ github.workspace }}/target/release/cli
        run: bun tests/dump/scripts/hmr-dev-e2e.mjs

      # deka#936: Fast Refresh must preserve sibling React state on a JSX edit.
      - name: Browser Fast Refresh sibling-state regression
        env:
          DEKA_DSC: ${{ github.workspace }}/.ci/dsc
          DEKA_NATIVE: ${{ github.workspace }}/target/release/cli
        run: bun tests/dump/scripts/fast-refresh-e2e.mjs

      - name: Report sccache usage
        if: ${{ always() && env.AWS_ACCESS_KEY_ID != '' && env.AWS_SECRET_ACCESS_KEY != '' && env.SCCACHE_ENDPOINT != '' }}
        run: |
          if command -v sccache >/dev/null 2>&1; then
            sccache --show-stats
          fi
