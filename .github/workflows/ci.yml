name: CI

on:
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  utility-css:
    name: Utility CSS generator
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Regenerate bundle
        working-directory: runtime/assets/utility-css
        run: bun build.ts

      - name: Check for uncommitted changes
        run: |
          if [ -n "$(git status --porcelain runtime/assets/utility-css/bundle.js)" ]; then
            echo "::error::runtime/assets/utility-css/bundle.js is out of date. Run 'bun build.ts' in that directory and commit the result."
            git diff runtime/assets/utility-css/bundle.js
            exit 1
          fi

      - name: Run utility-css smoke tests
        working-directory: runtime/assets/utility-css
        run: bun test.ts

  rust:
    name: Rust tests
    runs-on: ubuntu-latest
    env:
      CARGO_INCREMENTAL: 0
      CARGO_PROFILE_DEV_DEBUG: 0
      CARGO_PROFILE_TEST_DEBUG: 0
    steps:
      - uses: actions/checkout@v4

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@1.96.0
        with:
          targets: wasm32-unknown-unknown

      - name: Setup Bun for browser WASM parity
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: runtime
          # The v8 crate downloads/stores a large static lib under
          # target/{debug,release}/gn_out, which rust-cache does not include by
          # default. Without it, `cargo test -p cli` re-downloads/rebuilds V8 and
          # can fail on a cold cache when the network download is flaky.
          cache-directories: |
            runtime/target/**/gn_out
          # Seed the cache even when V8 linking fails, so the next run can reuse
          # the downloaded static lib instead of hitting the network again.
          cache-on-failure: true

      # Build only the crates we test. The full workspace includes
      # phpx_compiler_wasm, which fails to link on ubuntu-latest due to V8
      # TLS relocation issues and is not needed for these test suites.
      - name: Build tested crates
        working-directory: runtime
        run: cargo build -p deka_http -p pool -p engine -p phpx_js -p php-rs -p bundler

      - name: Test deka_http
        working-directory: runtime
        run: cargo test -p deka_http

      - name: Test pool
        working-directory: runtime
        run: cargo test -p pool

      - name: Test engine
        working-directory: runtime
        run: cargo test -p engine

      - name: Test PHPX compiler (incl. integration tests)
        working-directory: runtime
        run: cargo test -p phpx_js

      - name: Test php-rs (parser + typechecker)
        working-directory: runtime
        run: cargo test -p php-rs

      - name: Test bundler
        working-directory: runtime
        run: cargo test -p bundler

      # `cli` tests are run single-threaded: the transpile phase-hook tests
      # and the self-update env-var tests mutate real process-global state
      # that cannot safely run in parallel. Assertion drift in
      # `emits_subset_ast_for_jsx_component` and related build tests was
      # fixed in dekaruntime/deka#61.
      - name: Test cli
        working-directory: runtime
        run: cargo test --locked -p cli --lib -- --test-threads=1

      - name: Build and test browser compiler WASM
        env:
          DEKA_SKIP_DIRTY_CHECK: 1
        run: runtime/scripts/test-deka-compiler-wasm.sh

      - name: Build CLI for runtime execution tests
        working-directory: runtime
        run: cargo build --release -p cli

      - name: Run DekaScript runtime execution suite
        run: bun runtime/tests/runtime-suite/run.mjs

      - name: Upload browser compiler WASM provenance
        uses: actions/upload-artifact@v4
        with:
          name: deka-compiler-wasm
          path: runtime/dist/deka-compiler-wasm/
