# Required checks execute the compiler, VM, UI and executable delivered today.
# Historical DSC/V8/React integration checks belong to the retired delivery path.
name: CI
on:
  pull_request:
    branches: [main]
  # Run by hand on main to get a Linux-built `rust-tour` artifact for an exact main commit:
  # deka.gg pins the tour to a main commit and checks it against that build's hashes.
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  native:
    uses: ./.github/workflows/vm-experiment.yml
  rust:
    name: Rust tests
    needs: [native]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Require all native runtime checks
        env:
          RESULT: ${{ needs.native.result }}
        run: |
          test "$RESULT" = success
